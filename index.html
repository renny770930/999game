<!DOCTYPE html>

<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1" name="viewport"/>
<title>魔法數學大冒險</title>
<style>

.z{display:inline-flex;align-items:center;vertical-align:middle;line-height:1;margin:0 .2em 0 .03em}
.z .h{display:inline-block}
.z .b{display:inline-flex;flex-direction:column;justify-content:center;font-size:.4em;line-height:1.02;
  margin-left:.12em;min-width:1em;font-weight:400;position:relative;letter-spacing:0}
.z .b span{display:block;text-align:center;position:relative}
.z .b .l{line-height:.6}
.z .b .zt{position:absolute;left:100%;top:-.45em;font-style:normal;margin-left:-.05em}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;background:#1d1b4b;color:#fff;font-size:20px;overflow-x:hidden}
.nozy .z .b{display:none}.nozy .z{margin:0}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#4b3fa8,transparent 50%),radial-gradient(circle at 80% 90%,#a83f8c,transparent 50%),#1d1b4b;z-index:-1}
.wrap{max-width:860px;margin:0 auto;padding:10px 12px 96px}
.bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:18px;padding:8px 12px;margin-bottom:10px}
.avatar{font-size:34px;width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;border:4px solid #ffd84d}
.rank{flex:1;min-width:0}
.rank .t{font-weight:900;font-size:19px}
.xp{height:12px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:3px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff8a3d);transition:width .8s}
.small{font-size:15px;opacity:.9}
.money{text-align:right;font-weight:900;font-size:19px;line-height:1.5;white-space:nowrap}
.pill{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:99px;padding:3px 10px;font-size:14px;cursor:pointer;font-weight:800;font-family:inherit;white-space:nowrap}
h1{text-align:center;font-size:30px;margin:4px 0;text-shadow:0 4px 0 #6a3fd1}
h2.sec{font-size:24px;margin:6px 0 10px;text-align:center}
.page{display:none}.page.on{display:block}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tabs button{flex:1;max-width:170px;border:0;background:none;font-family:inherit;color:#7a74a8;font-weight:900;font-size:16px;cursor:pointer;border-radius:14px;padding:4px 0}
.tabs button .i{font-size:28px;display:block;line-height:1.2}
.tabs button.on{background:#efeaff;color:#5a35c9}
.tabs .dot{display:inline-block;width:10px;height:10px;background:#ff5f6d;border-radius:50%;vertical-align:top}
/* map */
.board{position:relative;margin:0 auto;max-width:820px;border-radius:26px;overflow:hidden}
.zone{position:absolute;left:0;right:0}
.board svg.path{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:24px;color:#4a3a00;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd84d 60%,#e6a700);box-shadow:0 6px 0 #a87400,0 8px 12px rgba(0,0,0,.3);z-index:2}
.node.boss{width:80px;height:80px;background:radial-gradient(circle at 35% 30%,#ffd0d0,#ff6b6b 60%,#c03b3b);color:#fff;box-shadow:0 6px 0 #8a2020,0 8px 12px rgba(0,0,0,.3)}
.node.lock{background:radial-gradient(circle at 35% 30%,#d8d6ea,#9c99bd 60%,#77749a);color:#eee;box-shadow:0 6px 0 #555274;cursor:not-allowed}
.node.cur{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.node .mon{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:28px}
.node .st{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:15px;color:#ffd84d;white-space:nowrap;letter-spacing:1px;text-shadow:0 1px 2px #000}
.node .st .e{color:rgba(255,255,255,.45)}
.node .num{line-height:1}
.node .tm{display:block;font-size:11px;font-weight:800;opacity:.85}
.zlabel{position:absolute;left:12px;white-space:nowrap;background:rgba(0,0,0,.35);color:#fff;border-radius:14px;padding:2px 12px;font-weight:900;font-size:17px;z-index:3}
.deco{position:absolute;font-size:30px;transform:translate(-50%,-50%);opacity:.9;pointer-events:none}
.token{position:absolute;width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 0 0 4px #6a3fd1,0 8px 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:34px;transform:translate(-50%,-115%);z-index:5;transition:left .35s ease-in-out,top .35s ease-in-out;pointer-events:none}
.token.hop{animation:hop .35s}
@keyframes hop{50%{transform:translate(-50%,-165%)}}
.secret{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px auto 0;max-width:820px}
.sbtn{border:0;border-radius:20px;padding:10px;font-family:inherit;cursor:pointer;background:linear-gradient(160deg,#3a2f7a,#6a3fd1);color:#fff;box-shadow:0 6px 0 #241b55;text-align:center}
.sbtn.lock{background:#4b4870;color:#aaa;box-shadow:0 6px 0 #2e2b4f}
.sbtn .m{font-size:36px}
.sbtn b{font-size:19px}
.under{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
/* panels */
.panel{background:#fff;color:#2b2b2b;border-radius:24px;padding:14px;margin-bottom:12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.panel h3{margin:0 0 6px;color:#5a35c9;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:3px solid #ece8ff;border-radius:18px;padding:8px;text-align:center;background:#faf8ff}
.item .m{font-size:46px;line-height:1.2}
.item.own{border-color:#4cd18a;background:#effbf4}
.item.use{border-color:#ffd84d;background:#fffbe6}
.item .nm{font-weight:900;font-size:17px}
.mini{border:0;border-radius:12px;padding:6px 12px;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;background:#6a3fd1;color:#fff;box-shadow:0 4px 0 #44269a;margin-top:4px}
.mini.g{background:#4cd18a;box-shadow:0 4px 0 #23995a}.mini.w{background:#eee;color:#555;box-shadow:0 4px 0 #bbb}
.mini:disabled{opacity:.45;cursor:not-allowed}
.mini:active{transform:translateY(3px);box-shadow:none}
/* pet */
.petstage{position:relative;background:linear-gradient(180deg,#bfe9ff,#e7f8ff 60%,#9be59b 60%,#7fd47f);border-radius:22px;height:300px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.petstage svg{margin-bottom:24px;transition:transform .3s}
.petstage svg.bounce{animation:bounce .6s}
@keyframes bounce{30%{transform:translateY(-30px) scale(1.05,.95)}60%{transform:translateY(0) scale(.95,1.05)}}
.heart{position:absolute;font-size:30px;animation:rise 1.2s forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-120px);opacity:0}}
.grow{height:18px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 0}
.grow i{display:block;height:100%;background:linear-gradient(90deg,#ff9ac2,#ff6fa5);transition:width .6s}
.petpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.petpick button{border:3px solid #ece8ff;border-radius:18px;background:#faf8ff;cursor:pointer;font-family:inherit;padding:6px}
.petpick button:hover{border-color:#6a3fd1}
input.txt{font-size:20px;padding:8px 10px;border-radius:12px;border:2px solid #ccc;font-family:inherit;width:100%;max-width:260px}
/* rewards */
.rw{display:flex;align-items:center;gap:10px;border:3px solid #ece8ff;border-radius:16px;padding:8px 10px;margin:8px 0;background:#faf8ff}
.rw .m{font-size:34px}
.rw .tx{flex:1;font-weight:900;font-size:19px}
.rw .cost{font-weight:900;color:#c08a00;white-space:nowrap}
.log{font-size:15px;color:#666;line-height:1.7}
/* battle */
#battle{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hearts{font-size:26px;letter-spacing:2px}
.score{font-weight:900;font-size:22px;color:#ffd84d}
.arena{position:relative;background:rgba(255,255,255,.08);border-radius:24px;padding:10px;margin:10px 0;text-align:center;overflow:hidden}
.monster{font-size:90px;line-height:1.1;display:inline-block}
.monster.hit{animation:hit .4s}.monster.atk{animation:atk .5s}.monster.dead{animation:dead .8s forwards}
@keyframes hit{25%{transform:translateX(-14px) rotate(-8deg);filter:brightness(2)}50%{transform:translateX(12px) rotate(6deg)}}
@keyframes atk{40%{transform:scale(1.4) translateY(20px)}}
@keyframes dead{to{transform:scale(0) rotate(360deg);opacity:0}}
.hp{height:16px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;max-width:360px;margin:4px auto}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5f6d,#ffc371);transition:width .3s}
.monname{font-weight:900}
.combo{position:absolute;top:10px;right:14px;font-weight:900;font-size:21px;color:#ffd84d}
.buddy{position:absolute;left:10px;bottom:6px}
.dmg{position:absolute;left:50%;top:30%;font-size:38px;font-weight:900;color:#ffd84d;animation:float .9s forwards;pointer-events:none;text-shadow:0 3px 0 #b35c10}
@keyframes float{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
.timer{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin:6px 0 0}
.timer i{display:block;height:100%;background:#4dd2ff}
.q{background:#fff;color:#2b2b2b;border-radius:24px;padding:10px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.qeq{font-size:52px;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace}
.qtext{font-size:23px;font-weight:800;line-height:2.1}
.ans{display:inline-block;min-width:96px;border-bottom:5px solid #6a3fd1;color:#6a3fd1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts button{font-size:38px;font-weight:900;padding:10px 0;border-radius:20px;border:0;background:#ece8ff;color:#3d2a8f;box-shadow:0 5px 0 #b9b0e8;cursor:pointer;font-family:inherit}
.opts button:active{transform:translateY(4px);box-shadow:0 1px 0 #b9b0e8}
.opts button.right{background:#4cd18a;color:#fff;box-shadow:0 5px 0 #23995a}
.opts button.wrong{background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #c03b3b}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{font-size:30px;font-weight:900;height:60px;border-radius:16px;border:0;background:#ece8ff;color:#3d2a8f;box-shadow:0 4px 0 #b9b0e8;cursor:pointer;font-family:inherit;white-space:nowrap}
.pad button.ok{background:#4cd18a;color:#fff;box-shadow:0 4px 0 #23995a;font-size:22px}
.pad button:active{transform:translateY(3px);box-shadow:none}
.fb{min-height:44px;font-weight:900;font-size:20px;margin-top:6px;line-height:2}
.fb.good{color:#23995a}.fb.bad{color:#c03b3b}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,8,40,.8);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.card{background:#fff;color:#2b2b2b;border-radius:28px;padding:18px;max-width:430px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3);animation:pop .35s;max-height:92vh;overflow:auto}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:4px 0;font-size:28px;color:#6a3fd1}
.bigstar{font-size:52px;letter-spacing:4px}
.btn{border:0;border-radius:18px;padding:11px 18px;font-size:21px;font-weight:900;cursor:pointer;font-family:inherit;background:#6a3fd1;color:#fff;box-shadow:0 5px 0 #44269a;margin:5px}
.btn.g{background:#4cd18a;box-shadow:0 5px 0 #23995a}.btn.w{background:#eee;color:#333;box-shadow:0 5px 0 #bbb}
.btn:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;justify-content:space-between;font-size:19px;padding:2px 10px}
.row b{color:#6a3fd1}
.lvup{background:linear-gradient(90deg,#ffe066,#ff9a3d);color:#5a2d00;border-radius:16px;padding:8px;font-weight:900;margin:8px 0;animation:pop .5s}
.rule{text-align:left;font-size:18px;line-height:2.1;background:#f5f2ff;border-radius:16px;padding:8px 14px;margin:8px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

.titlescr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;z-index:12;overflow:auto;padding:20px}
.ttlwrap{max-width:640px}
.ttl{font-size:44px;line-height:1.7;margin:6px 0 8px;color:#ffe066;text-shadow:0 5px 0 #6a3fd1,0 0 26px rgba(255,216,77,.55)}
.ttl b{color:#fff}
.float{position:absolute;font-size:36px;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(10deg)}}
.ttlhero{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:6px 0}
.avatar.big{width:100px;height:100px;font-size:62px;border-width:6px}
.btn.big{font-size:30px;padding:14px 44px;margin:16px 6px 10px}
.node.mgnode{background:radial-gradient(circle at 35% 30%,#fff,#7ee0ff 55%,#3aa9d8);box-shadow:0 6px 0 #1f7aa3,0 8px 12px rgba(0,0,0,.3);font-size:30px}
.node .mtag{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:13px;background:#fff;color:#1f7aa3;border-radius:8px;padding:0 6px;white-space:nowrap;line-height:1.9}
.node .hard{position:absolute;top:-6px;right:-16px;background:#ff6b6b;color:#fff;border-radius:10px;font-size:12px;padding:1px 5px;line-height:1.2}
.zlabel b{font-size:19px;color:#ffe066}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.diff{border:0;border-radius:18px;padding:10px 6px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;color:#2b2b2b}
.diff.n{background:#e9fbe9;box-shadow:0 5px 0 #8fd6aa}.diff.h{background:#ffe9e9;box-shadow:0 5px 0 #f0a0a0}.diff.lock{opacity:.55;cursor:not-allowed}
.diff:active{transform:translateY(4px);box-shadow:none}
.diff b{font-size:22px}.diff span.nz{color:#f2b705;font-size:20px;letter-spacing:2px}.diff i{color:#ccc;font-style:normal}
.hardtag{display:inline-block;background:#ff6b6b;color:#fff;border-radius:10px;padding:0 10px;font-weight:900;font-size:16px}
.hardtag.big{font-size:20px;margin:4px 0}
.astag{color:#1f7aa3;font-size:18px}
.mghint{text-align:center;font-weight:900;font-size:22px;margin:8px 0;min-height:48px;line-height:2}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
.mc{height:84px;border:0;border-radius:16px;background:linear-gradient(160deg,#6a3fd1,#a46be8);box-shadow:0 5px 0 #44269a;cursor:pointer;font-family:inherit;font-size:26px;font-weight:900;color:transparent;position:relative}
.mc::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.mc.up{background:#fff;color:#3d2a8f}.mc.up::after{content:''}
.mc.ok{background:#4cd18a;color:#fff;box-shadow:0 5px 0 #23995a}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:460px;margin:0 auto}
.hole{height:124px;background:radial-gradient(ellipse at 50% 88%,#5a3a1a 0 34%,#7fd47f 36%);border-radius:20px;position:relative;overflow:hidden}
.mole{position:absolute;left:50%;bottom:-110px;transform:translateX(-50%);width:90px;height:106px;border:0;background:none;cursor:pointer;transition:bottom .18s;font-family:inherit;display:flex;flex-direction:column;align-items:center;padding:0}
.mole.up{bottom:4px}
.mole .mf{font-size:54px;line-height:1}
.mole b{background:#fff;color:#3d2a8f;border-radius:10px;padding:0 8px;font-size:24px;margin-top:-4px}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
.sc{height:70px;border:0;border-radius:16px;background:#fff;color:#3d2a8f;font-size:28px;font-weight:900;box-shadow:0 5px 0 #b9b0e8;cursor:pointer;font-family:inherit}
.sc.sel{background:#ffe066}.sc.ok{background:#4cd18a;color:#fff}.sc.bad{background:#ff6b6b;color:#fff}
.sky{position:relative;height:540px;background:linear-gradient(180deg,#7ad0ff,#d4f1ff);border-radius:22px;overflow:hidden}
.bub{position:absolute;bottom:-100px;width:100px;height:100px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.4) 30%,rgba(120,170,255,.55));color:#24247a;font-weight:900;font-size:22px;cursor:pointer;font-family:inherit;animation:rise2 6s linear forwards;padding:0}
@keyframes rise2{to{transform:translateY(-660px)}}
.bub.popped{opacity:0;transition:opacity .2s}
.bub.wrongb{background:radial-gradient(circle at 30% 30%,#fff,#ffb3b3)}
@media(max-width:520px){.zlabel{font-size:12px;right:8px;white-space:normal;line-height:1.6}.zlabel b{font-size:16px}.ttl{font-size:32px}.btn.big{font-size:24px;padding:12px 30px}.mc{height:70px;font-size:20px}.sc{font-size:22px;height:60px}.bub{width:84px;height:84px;font-size:18px}.sky{height:480px}}


.sub{text-align:center;opacity:.9;margin:0 0 12px}
.planets{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;margin:0 auto}
.planet{border:0;border-radius:26px;padding:14px 10px;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(160deg,var(--pc),#2a2470);box-shadow:0 8px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:4px}
.planet:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.planet .orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 55%,rgba(0,0,0,.25));display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 0 24px var(--pc);animation:spin 6s ease-in-out infinite}
@keyframes spin{50%{transform:translateY(-6px) rotate(6deg)}}
.planet b{font-size:20px}
.pbar{width:80%;height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:#ffe066}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.maphead h1{flex:1;line-height:1.5}
.maphead h1 .small{font-size:14px;text-shadow:none}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin:0 .1em}
.fr i{font-style:normal;padding:0 .15em}.fr i:first-child{border-bottom:3px solid currentColor}
.mixw{font-size:1em}
.qeq.long{font-size:34px}
.sol .fr{font-size:.8em}
.pad button.wide{grid-column:span 3}
.garden{position:relative;height:380px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#a8e4ff 0%,#dff6ff 45%,#9be59b 45%,#6fcf7a 100%);touch-action:none}
.garden .sun{position:absolute;right:6%;top:6%;font-size:46px}
.cloud{position:absolute;width:110px;height:36px;background:#fff;border-radius:40px;opacity:.9;animation:drift 30s linear infinite}
.cloud::before{content:'';position:absolute;width:50px;height:50px;background:#fff;border-radius:50%;left:20px;top:-24px}
.cloud.c1{top:12%;left:-20%}.cloud.c2{top:24%;left:-40%;animation-duration:42s;animation-delay:-14s;transform:scale(.7)}
@keyframes drift{to{left:110%}}
.furn{position:absolute;font-size:46px;cursor:grab;user-select:none;touch-action:none;z-index:2;filter:drop-shadow(0 4px 2px rgba(0,0,0,.2))}
.furn.drag{cursor:grabbing;transform:scale(1.2);z-index:9}
.gpet{position:absolute;bottom:4%;cursor:pointer;z-index:3;animation:wander 10s ease-in-out infinite alternate}
.gpet svg{display:block;animation:bob 1.2s ease-in-out infinite}
.gpet.act svg{filter:drop-shadow(0 0 8px #fff6a0)}
.gpet.jump svg{animation:jump .6s 2}
.gpet .ptag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:20px}

function F(n,d){return '<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'}
function Q(h,ans,sol,o){o=o||{};o.h=h;o.ans=ans;o.sol=sol;return o}
function W(t,tv,h,ans,sol,o){o=Q(h,ans,sol,o);o.t=t;o.tv=tv;return o}

function subQ(a,b){return Q(a+' − '+b+' = ?',a-b,a+' − '+b+' = '+(a-b))}

 o+='<circle cx="'+(cx-ex+er*.35)+'" cy="'+(ey-er*.35)+'" r="'+(er*.4)+'" fill="#fff"/><circle cx="'+(cx+ex+er*.35)+'" cy="'+(ey-er*.35)+'" r="'+(er*.4)+'" fill="#fff"/>';
 o+='<ellipse cx="'+(cx-r*.55)+'" cy="'+(cy+r*.1)+'" rx="'+(r*.13)+'" ry="'+(r*.08)+'" fill="#ff8fab" opacity=".7"/><ellipse cx="'+(cx+r*.55)+'" cy="'+(cy+r*.1)+'" rx="'+(r*.13)+'" ry="'+(r*.08)+'" fill="#ff8fab" opacity=".7"/>';
 if(type=='penguin')o+='<path d="M'+(cx-r*.12)+' '+(cy+r*.02)+' L'+(cx+r*.12)+' '+(cy+r*.02)+' L'+cx+' '+(cy+r*.2)+'Z" fill="#ffa53d" stroke="#e08a1e" stroke-width="2" stroke-linejoin="round"/>';
 else o+='<path d="M'+(cx-r*.12)+' '+(cy+r*.08)+' q'+(r*.06)+' '+(r*.1)+' '+(r*.12)+' 0 q'+(r*.06)+' '+(r*.1)+' '+(r*.12)+' 0" fill="none" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"/>';
 // 腳
 o+='<ellipse cx="'+(cx-r*.4)+'" cy="'+(by-2)+'" rx="'+(r*.22)+'" ry="'+(r*.1)+'" fill="'+d+'"/><ellipse cx="'+(cx+r*.4)+'" cy="'+(by-2)+'" rx="'+(r*.22)+'" ry="'+(r*.1)+'" fill="'+d+'"/>';
 // 配件
 if(stage>=3)o+='<path d="M'+(cx-r*.5)+' '+(cy+r*.62)+' Q'+cx+' '+(cy+r*.85)+' '+(cx+r*.5)+' '+(cy+r*.62)+'" fill="none" stroke="#ff6b6b" stroke-width="'+(r*.12)+'" stroke-linecap="round"/><circle cx="'+(cx+r*.15)+'" cy="'+(cy+r*.76)+'" r="'+(r*.08)+'" fill="#ffd84d"/>';
 if(stage==4)o+='<path d="M'+(cx-r*.35)+' '+(cy-r*.95)+' L'+(cx-r*.35)+' '+(cy-r*1.3)+' L'+(cx-r*.17)+' '+(cy-r*1.12)+' L'+cx+' '+(cy-r*1.4)+' L'+(cx+r*.17)+' '+(cy-r*1.12)+' L'+(cx+r*.35)+' '+(cy-r*1.3)+' L'+(cx+r*.35)+' '+(cy-r*.95)+'Z" fill="#ffd84d" stroke="#d8a400" stroke-width="3" stroke-linejoin="round"/><circle cx="'+cx+'" cy="'+(cy-r*1.1)+'" r="'+(r*.06)+'" fill="#ff6b6b"/>'+
  '<text x="30" y="60" font-size="22">✨</text><text x="150" y="80" font-size="18">✨</text>';
 return o+'</g></svg>'}

// ================= 獎勵 =================
var parentOK=false;
function drawReward(){var p=$('p-reward');
 var h='<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="sec" style="margin:6px 0">'+T('獎勵卡')+'</h2><button class="btn" id="parentBtn" style="font-size:18px;padding:8px 14px">🔒 '+T('家長設定')+'</button></div><div id="parentArea"></div><div class="panel"><p class="small" style="color:#666;margin-top:0">'+T('用金幣換爸爸媽媽準備的獎勵。換好以後，拿給爸爸媽媽看！')+'</p>';
 S.rewards.forEach(function(r,i){h+='<div class="rw"><div class="m nz">'+r.e+'</div><div class="tx">'+TT(r.n)+'</div><div class="cost nz">🪙 '+r.c+'</div><button class="mini'+(S.coins>=r.c?' g':'')+'" data-rd="'+i+'"'+(S.coins<r.c?' disabled':'')+'>'+T('兌換')+'</button></div>'});
 h+='</div>';
 if(S.log.length)h+='<div class="panel"><h3>'+T('兌換紀錄')+'</h3><div class="log">'+S.log.slice(-10).reverse().map(function(l){return esc(l.d)+'　'+TT(l.n)+'　<span class="nz">🪙'+l.c+'</span>'+(l.done?'　<b style="color:#23995a">'+T('已兌現')+'</b>':'')}).join('<br>')+'</div></div>';
 
 p.innerHTML=h;
 p.querySelectorAll('[data-rd]').forEach(function(b){b.onclick=function(){var r=S.rewards[+b.dataset.rd];if(S.coins<r.c)return;
  $('ovCard').innerHTML='<div class="bigstar nz">'+r.e+'</div><div class="qtext">'+T('要用{n}金幣兌換嗎？',{n:r.c})+'<br>'+TT(r.n)+'</div><button class="btn w" onclick="closeOv()">'+T('先不要')+'</button><button class="btn g" id="okRd">'+T('兌換！')+'</button>';$('ov').classList.add('on');
  $('okRd').onclick=function(){S.coins-=r.c;var d=new Date();S.log.push({n:r.n,c:r.c,d:(d.getMonth()+1)+'/'+d.getDate(),done:false});save();sfx('buy');celebrate();
   $('ovCard').innerHTML='<div class="bigstar nz">🎉</div><h2>'+T('兌換成功！')+'</h2><div class="qtext">'+TT(r.n)+'<br>'+T('快去找爸爸媽媽領獎勵吧！')+'</div><button class="btn" onclick="closeOv();drawReward();drawBar()">'+T('好！')+'</button>'}}});
 $('parentBtn').onclick=function(){if(parentOK){drawParent();return}parentGate()}}
function pinInput(id){return '<input class="txt" id="'+id+'" type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="text-align:center;letter-spacing:6px;max-width:200px">'}
function parentGate(){
 if(!S.pin){ // 第一次：設定密碼
  $('ovCard').innerHTML='<h2>🔒 '+T('設定家長密碼')+'</h2><div class="small" style="color:#666">'+T('請家長設定4到6位數字的密碼，以後打開家長設定都要輸入。')+'</div>'+
   '<p>'+T('輸入密碼')+'<br>'+pinInput('pin1')+'</p><p>'+T('再輸入一次')+'<br>'+pinInput('pin2')+'</p><div class="fb bad" id="pinMsg"></div>'+
   '<button class="btn w" onclick="closeOv()">'+T('取消')+'</button><button class="btn" id="pinSet">'+T('設定')+'</button>';
  $('ov').classList.add('on');$('pin1').focus();
  $('pinSet').onclick=function(){var a=$('pin1').value,b=$('pin2').value;
   if(!/^\d{4,6}$/.test(a)){$('pinMsg').innerHTML=T('密碼要是4到6位數字');return}
   if(a!==b){$('pinMsg').innerHTML=T('兩次輸入的密碼不一樣');$('pin2').value='';return}
   S.pin=a;save();parentOK=true;closeOv();sfx('ok');drawParent();toast(T('密碼設定好了！請記住它。'))};return}
 $('ovCard').innerHTML='<h2>🔒 '+T('家長設定')+'</h2><p>'+T('請輸入家長密碼')+'<br>'+pinInput('pinIn')+'</p><div class="fb bad" id="pinMsg"></div>'+
  '<button class="btn w" onclick="closeOv()">'+T('取消')+'</button><button class="btn" id="pinGo">'+T('確定')+'</button><br><button class="mini w" id="pinForgot">'+T('忘記密碼？')+'</button>';
 $('ov').classList.add('on');$('pinIn').focus();
 $('pinIn').onkeydown=function(e){if(e.key=='Enter')$('pinGo').click()};
 $('pinGo').onclick=function(){if($('pinIn').value===S.pin){parentOK=true;closeOv();drawParent()}else{sfx('no');$('pinIn').value='';$('pinMsg').innerHTML=T('密碼不對')}};
 $('pinForgot').onclick=function(){var a=rnd(213,879),b=rnd(23,89);
  $('ovCard').innerHTML='<h2>'+T('忘記密碼')+'</h2><div class="small" style="color:#666">'+T('請家長算出答案，答對就可以重新設定密碼。')+'</div><div class="qeq nz" style="font-size:36px">'+a+' × '+b+' = ?</div>'+
   '<input class="txt" id="fgAns" inputmode="numeric" style="text-align:center"><div class="fb bad" id="pinMsg"></div><button class="btn w" onclick="closeOv()">'+T('取消')+'</button><button class="btn" id="fgGo">'+T('確定')+'</button>';
  $('fgGo').onclick=function(){if(+$('fgAns').value===a*b){delete S.pin;save();parentGate()}else{sfx('no');$('pinMsg').innerHTML=T('答案不對')}}}}
function drawParent(){var h='<div class="panel" style="border:4px solid #6a3fd1"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">'+T('家長設定')+'</h3><button class="mini w" id="pClose">'+T('關閉')+'</button></div>'+
 '<h3 style="margin-top:12px">'+T('獎勵和需要的金幣')+'</h3><p class="small" style="color:#666;margin:0">'+T('可以改圖示、名字和需要的金幣，改好以後按「儲存」。')+'</p>';
 S.rewards.forEach(function(r,i){h+='<div class="rw" style="flex-wrap:wrap"><input class="txt" style="width:56px;max-width:56px;text-align:center" data-e="'+i+'" value="'+esc(r.e)+'"><input class="txt" style="flex:1;min-width:120px" data-n="'+i+'" value="'+esc(r.n)+'">'+
  '<span style="display:flex;align-items:center;gap:4px;justify-content:center"><span class="nz" style="font-size:15px;color:#888;font-weight:800">🪙</span><button class="mini w" data-minus="'+i+'">−50</button><input class="txt" style="width:76px;text-align:center" data-c="'+i+'" inputmode="numeric" value="'+r.c+'"><button class="mini w" data-plus="'+i+'">+50</button></span>'+
  '<button class="mini w" data-del="'+i+'">'+T('刪除')+'</button></div>'});
 h+='<button class="mini" id="rAdd">'+T('新增一個')+'</button> <button class="mini g" id="rSave">'+T('儲存')+'</button>';
 h+='<h3 style="margin-top:14px">'+T('每一關給的金幣')+'</h3><p class="small" style="color:#666;margin:0">'+T('覺得金幣來得太快或太慢，可以調整。')+'</p><div>'+
  [[0.5,'少一點'],[1,'標準'],[2,'多一點']].map(function(x){return '<button class="mini'+(S.coinRate==x[0]?'':' w')+'" data-rate="'+x[0]+'">'+T(x[1])+' <span class="nz">×'+x[0]+'</span></button> '}).join('')+'</div>'+
  '<p class="small" style="color:#666">'+T('標準大約是：打贏一關得到{a}到{b}金幣',{a:Math.round(120*S.coinRate),b:Math.round(300*S.coinRate)})+'</p>';
 if(S.log.some(function(l){return !l.done}))h+='<h3 style="margin-top:12px">'+T('還沒兌現的')+'</h3>'+S.log.map(function(l,i){return l.done?'':'<div class="rw"><div class="tx">'+esc(l.d)+' '+TT(l.n)+'</div><button class="mini g" data-done="'+i+'">'+T('已兌現')+'</button></div>'}).join('');
 h+='<h3 style="margin-top:14px">'+T('孩子的名字')+'</h3><input class="txt" id="pName" maxlength="6" value="'+esc(S.name)+'"> <button class="mini" id="pNameSave">'+T('儲存名字')+'</button><p class="small" style="color:#666">'+T('首頁會顯示「名字＋的魔法乘法大冒險」。')+'</p>'+
 '';
 h+='<h3 style="margin-top:12px">'+T('家長小工具')+'</h3><button class="mini w" id="rCoin">'+T('送100金幣')+'</button> <button class="mini w" id="rPin">'+T('更改密碼')+'</button> <button class="mini w" id="rReset">'+T('遊戲全部重來')+'</button></div>';
 $('parentArea').innerHTML=h;
 function collect(){S.rewards=S.rewards.map(function(r,i){return{e:document.querySelector('[data-e="'+i+'"]').value||'🎁',n:document.querySelector('[data-n="'+i+'"]').value||'獎勵',c:Math.max(1,parseInt(document.querySelector('[data-c="'+i+'"]').value)||100)}})}
 function redraw(){drawReward();drawParent();$('parentArea').scrollIntoView({behavior:'smooth'})}
 $('pClose').onclick=function(){$('parentArea').innerHTML=''};
 $('rSave').onclick=function(){collect();save();sfx('ok');redraw();toast(T('儲存好了！'))};
 $('rAdd').onclick=function(){collect();S.rewards.push({e:'🎁',n:'新的獎勵',c:300});save();redraw()};
 document.querySelectorAll('[data-minus],[data-plus]').forEach(function(b){b.onclick=function(){var neg=b.dataset.minus!=null,i=neg?b.dataset.minus:b.dataset.plus,inp=document.querySelector('[data-c="'+i+'"]');inp.value=Math.max(10,(parseInt(inp.value)||0)+(neg?-50:50))}});
 document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){collect();S.rewards.splice(+b.dataset.del,1);save();redraw()}});
 document.querySelectorAll('[data-done]').forEach(function(b){b.onclick=function(){S.log[+b.dataset.done].done=true;save();redraw()}});
 document.querySelectorAll('[data-rate]').forEach(function(b){b.onclick=function(){collect();S.coinRate=+b.dataset.rate;save();redraw()}});
 $('pNameSave').onclick=function(){S.name=($('pName').value.trim()||NAME_DEFAULT).slice(0,6);save();sfx('ok');toast(T('名字改好了！'))};
 $('rPin').onclick=function(){delete S.pin;save();parentOK=false;$('parentArea').innerHTML='';parentGate()};
 $('rCoin').onclick=function(){S.coins+=100;save();drawBar();redraw()};
 var arm=false;$('rReset').onclick=function(){if(!arm){arm=true;$('rReset').innerHTML=T('真的要清除嗎？再按一次');return}try{localStorage.removeItem('tt99game')}catch(e){}location.reload()}}


// ================= 啟動 =================
$('startBtn').onclick=function(){ac();setPaused(false);sfx('buy');leaveTitle()};
$('toHub').onclick=function(){show('hub')};
bindCommon(document);
$('mapParent').onclick=function(){show('reward');$('parentBtn').click()};
$('speedBtn').onclick=function(){S.speed=(S.speed+1)%3;save();drawMap()};
if(S.lastR)CUR=RG(S.lastR);
showTitle();
</script>
