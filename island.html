<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>島嶼探險隊｜二上複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#7cc6e8; --sea-deep:#3a8fbf; --ink:#1f3347; --muted:#5b6b7a;
  --card:#fffdf7; --good:#2e9d5b; --bad:#d9534f; --gold:#f2b632; --line:#e6dcc4;
}
*{box-sizing:border-box}
html{background:#7cc6e8}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);font-size:18px;min-height:100vh;
  background:linear-gradient(180deg,#bfe6f7 0%,#9fd6ef 45%,#7cc6e8 100%);}
button{font-family:inherit;cursor:pointer}
#world{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;touch-action:none}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#hud .hud-in{pointer-events:auto}
#app{position:relative;z-index:3}
#app.overlay{min-height:100vh;background:rgba(160,214,239,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:900;font-size:26px;letter-spacing:1px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.brand small{font-size:14px;font-weight:500;color:var(--muted)}
.spacer{flex:1}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;gap:6px;align-items:center}
.btn{border:none;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.primary{background:var(--gold);color:#3b2a00}
.btn.ghost{background:rgba(255,255,255,.75)}
.btn.small{padding:8px 12px;font-size:15px;border-radius:10px}
.tog{border:none;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;background:rgba(255,255,255,.75);color:var(--muted);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tog.on{background:#fff;color:var(--ink);outline:2px solid var(--gold)}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 0 rgba(31,51,71,.10)}
h2{margin:0 0 12px;font-size:24px}
.hidden{display:none!important}

/* zhuyin */
.zc{display:inline-flex;align-items:center;vertical-align:baseline;margin:0 .05em 0 0}
.zc .b{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:.42em;line-height:1;margin-left:.08em;margin-right:.5em;position:relative;font-weight:500;color:#48607a;min-height:2em}
.zc .b i{font-style:normal;display:block}
.zc .b .t{position:absolute;left:100%;margin-left:.05em;top:50%;transform:translateY(-35%)}
.zc .b .n{line-height:.6}
body.zy .qtext,body.zy .opt,body.zy .feedback,body.zy .passage{letter-spacing:.02em}
/* profile */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:12px 0}
.prof{border:3px solid transparent;background:#fff;border-radius:18px;padding:16px;text-align:center;font-size:20px;font-weight:700}
.prof .av{font-size:44px;display:block}
.prof:hover{border-color:var(--gold)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.addrow input{flex:1;min-width:160px;font-size:20px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-family:inherit}
.avatars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.avatars button{font-size:28px;border:3px solid transparent;background:#fff;border-radius:12px;padding:4px 8px}
.avatars button.sel{border-color:var(--gold)}

/* 3D HUD */
.hud-top{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;background:rgba(255,255,255,.88);border-radius:999px;padding:8px 18px;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap;transition:opacity .4s}
.hud-bottom{position:absolute;left:16px;right:110px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.hud-bottom .btn{padding:10px 14px;font-size:16px}
body.panel-open .hud-bottom{right:470px}
@media (max-width:700px){.hud-bottom{right:84px}.hud-bottom .btn{padding:8px 10px;font-size:14px}}
.panel{position:absolute;right:16px;top:72px;bottom:16px;width:340px;max-width:calc(100vw - 32px);overflow:auto;background:rgba(255,253,247,.96);border-radius:22px;box-shadow:0 8px 0 rgba(31,51,71,.14);transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.panel-head{padding:14px 16px;color:#fff;border-radius:22px 22px 0 0;display:flex;align-items:center;gap:10px}
.panel-head b{font-size:24px;display:block}
.panel-head span{font-size:14px}
.panel .levels{padding:12px}
@media (max-width:700px){
  .panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:47vh;transform:translateY(120%)}
  .panel.open{transform:none}
  .hint{bottom:132px;font-size:15px}
  .brand small{display:none}
}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sitem{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.sicon{font-size:46px;line-height:1.1}
.sname{font-weight:900;font-size:18px}
.sdesc{font-size:14px;color:var(--muted);flex:1}
.rwrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rwrow input{font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);font-family:inherit}

/* buddy */
.buddy{position:fixed;right:14px;bottom:12px;z-index:6;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.buddy .fig{pointer-events:auto;border:none;background:none;padding:0;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
.buddy .bub{pointer-events:none;max-width:240px;background:#fff;border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.1);opacity:0;transform:translateY(8px);transition:.3s;margin-bottom:40px;position:relative}
.buddy .bub:after{content:"";position:absolute;right:-8px;bottom:14px;border:8px solid transparent;border-left-color:#fff}
.buddy.talk .bub{opacity:1;transform:none}
body.zy .buddy .bub{line-height:2.1}
body.panel-open .buddy{right:372px}
@media (max-width:700px){body.panel-open .buddy{display:none}.buddy .fig svg{width:64px;height:64px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hop{animation:hop .5s ease!important}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) scale(1.05)}}
.bpick.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold) inset}
.room{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.roomfig{flex:0 0 220px;display:grid;place-items:center;background:radial-gradient(circle at 50% 70%,#fff6dc,#f3ead2);border-radius:20px;min-height:240px;position:relative}
.roombub{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.roominfo{flex:1;min-width:260px}
.sbar{display:flex;align-items:center;gap:8px;margin:6px 0}.sbar>span{width:44px;font-weight:700}.sbar b{width:34px;text-align:right}
.sb{flex:1;height:14px;background:#efe6cf;border-radius:99px;overflow:hidden}.sb i{display:block;height:100%;border-radius:99px}
.actrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.food{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
/* level lobby */
.lvcard{padding:0;overflow:hidden}
.lvhead{color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center}.lvhead small{display:block;opacity:.9}.lvhead b{font-size:24px}
.tabs.big{padding:12px 16px 0;margin:0}.tabs.big .tog{font-size:18px;padding:10px 16px}
.lvbody{padding:12px 18px 20px}
.lvbody h3{margin:18px 0 8px}
.pts li{margin:6px 0;line-height:1.7}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ccard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.ctop{display:flex;align-items:center;gap:6px}
.cbig{font-size:54px;font-weight:700;line-height:1;font-family:"Noto Sans TC",serif}
.czy .zc.solo .b{font-size:20px;color:#2f4a66;min-height:60px}
.spk{margin-left:auto;border:none;background:#f3ead2;border-radius:10px;font-size:20px;padding:6px 10px}
.cmeta{display:flex;gap:12px;font-size:15px;color:var(--muted);margin:6px 0}
.cmeta b{color:var(--ink);font-size:17px}
.cwords{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.chip{display:inline-block;background:#fff6dc;border:1.5px solid #f0d58a;border-radius:10px;padding:2px 10px;font-weight:700}
.csent{font-size:16px;color:#3b4c5c;margin-top:4px;line-height:1.7}
body.zy .csent,body.zy .pts li,body.zy .tip,body.zy .clr>div>span,body.zy .pat li{line-height:2.3}
.zc .b{line-height:1!important}
.pat{background:#eef6ff;border-radius:14px;padding:10px 14px;margin:8px 0}
.tip{background:#fff2e5;border-left:6px solid #f3a64a;border-radius:10px;padding:10px 14px;margin:8px 0}
.clr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media (max-width:560px){.clr{grid-template-columns:1fr}}
.clr>div{border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.cx{background:#fde9e8}.co{background:#e5f6ec}
/* games */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{height:96px;border:none;border-radius:14px;background:linear-gradient(135deg,#6fb3ff,#2f80c9);color:#fff;font-size:30px;font-weight:900;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mcard .face{display:none;color:var(--ink);font-size:20px}
.mcard.open{background:#fff;border:3px solid var(--gold)}.mcard.open .back{display:none}.mcard.open .face{display:block}
.mcard.peek .back{display:none}.mcard.peek .face{display:block}.mcard.peek{background:#fff;border:3px solid #9fd6ef}
.mbar{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0 0;flex-wrap:wrap}
.mcard.done{background:#e5f6ec;border-color:var(--good)}
.sortwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.sortitem{font-size:30px;font-weight:900;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:16px 28px;min-width:160px;text-align:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.bin{border:3px dashed #c9bfa5;background:#fffaf0;border-radius:18px;padding:14px;min-height:150px;font-size:18px;color:var(--ink)}
.bin:hover{border-color:var(--sea-deep)}
.binin{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed #c9bfa5;border-radius:14px;padding:10px 12px;min-height:52px;font-size:19px;font-weight:700}
.slot.fill{border-style:solid;border-color:var(--good);background:#e5f6ec}
.sn{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900;flex:none}
.slots.small .slot{min-height:40px;font-size:16px;padding:6px 10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.poparea{position:relative;height:340px;background:linear-gradient(180deg,#e6f6ff,#c8ebfb);border-radius:18px;overflow:hidden}
.bubble{position:absolute;width:18%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 30%,#fff,rgba(160,220,255,.75) 40%,rgba(120,190,240,.55));font-size:22px;font-weight:900;color:var(--ink);display:grid;place-items:center;animation:float 3s ease-in-out infinite;box-shadow:0 4px 10px rgba(0,0,0,.08)}
@media (max-width:560px){.bubble{font-size:15px}}
.bubble.popped{animation:popb .35s forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cctl{display:flex;flex-direction:column;gap:8px;align-items:center}.cctl>div{display:flex;gap:6px;align-items:center}.cctl b{min-width:36px;text-align:center;font-size:22px}
.target{text-align:center;font-size:20px;margin-bottom:6px}
.quick{text-align:center}.qcount{color:var(--muted)}
.qstate{font-size:26px;font-weight:900;margin:18px 0;line-height:1.6}
.qbtns{display:flex;gap:20px;justify-content:center}
.qo{width:110px;height:110px;border-radius:50%;border:4px solid var(--good);background:#fff;font-size:60px;color:var(--good);font-weight:900}
.qo.x{border-color:var(--bad);color:var(--bad)}
/* exam */
.unitpick{display:flex;flex-wrap:wrap;gap:8px}
.chk{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.paper{background:#fff;border-radius:6px;padding:22px;box-shadow:0 6px 0 rgba(31,51,71,.1);background-image:linear-gradient(#fff 0,#fff 100%)}
.phead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #1f3347;padding-bottom:10px;margin-bottom:10px;gap:10px}
.score{width:92px;height:92px;border:3px solid #e23b2e;border-radius:50%;display:grid;place-items:center;color:#e23b2e;font-weight:900;font-size:36px;flex:none}
.score small{font-size:14px;color:#c98a8a}
.esec h3{border-left:6px solid var(--gold);padding-left:10px}
.eitem{padding:10px 6px;border-bottom:1px dashed #e0d6bd}
.eitem.ng{background:#fff6f5}.eitem.ok{background:#f6fcf8}
.eq{display:flex;gap:6px;font-size:20px;font-weight:700;line-height:1.6;align-items:flex-start}
body.zy .eq,body.zy .eopt,body.zy .eexp{line-height:2.3}
.eno{color:var(--muted)}
.mark{margin-left:auto;font-size:28px;font-weight:900}.ok .mark{color:var(--good)}.ng .mark{color:var(--bad)}
.eopts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 26px}
.eopt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.eopt.sel{border-color:var(--sea-deep);background:#e8f4ff}
.eopt.right{border-color:var(--good);background:#e5f6ec}.eopt.wrong{border-color:var(--bad);background:#fde9e8}
.eopts.tf .eopt{font-size:26px;width:70px}
.enum{margin:8px 0 0 26px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.enum input{width:110px;font-size:22px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);font-family:inherit}
.eans{color:var(--bad);font-weight:700}
.eexp{margin:8px 0 0 26px;background:#fff2e5;border-radius:10px;padding:8px 12px;font-size:16px}
.bigscore{font-size:72px;font-weight:900;color:#e23b2e}
.sech{border-left:6px solid var(--gold);padding-left:10px}
.arow{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 0 26px;font-size:17px}.okc{color:var(--good)}.ngc{color:var(--bad)}
#att.onlyw .eitem.ok{display:none}
.a4wrap{background:#8aa4b5;border-radius:16px;padding:18px;margin-top:14px;overflow:auto}
.a4{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm 13mm;box-shadow:0 4px 18px rgba(0,0,0,.25)}
/* 2D map fallback */
.islands{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.island{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(31,51,71,.12)}
.island-head{padding:14px 18px;color:#fff;display:flex;align-items:center;gap:10px}
.island-head .ic{font-size:32px}
.island-head b{font-size:24px;display:block}
.island-head span{font-size:14px;opacity:.95}
.levels{padding:8px 14px 16px;display:flex;flex-direction:column;gap:8px}
.lv{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:17px;color:var(--ink)}
.lv:hover{border-color:var(--gold)}
.lv .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.lv .t{flex:1;line-height:1.3}
.lv .t small{display:block;color:var(--muted);font-size:13px}
.stars{color:var(--gold);font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#d8d0bd}
.extra{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.extra .card{flex:1;min-width:240px;display:flex;align-items:center;gap:14px}
.extra .card .big{font-size:42px}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.progress{flex:1;height:14px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;min-width:120px}
.progress i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.qtitle{font-size:15px;color:var(--muted);margin-bottom:6px}
.qtext{font-size:26px;font-weight:700;line-height:1.5;margin:6px 0 14px}
.passage{background:#fff6dc;border-left:6px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:20px;line-height:1.8;margin-bottom:10px}
.visual{display:flex;justify-content:center;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.qtext{font-size:22px}}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:16px;font-size:22px;font-weight:700;text-align:left;min-height:64px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--sea-deep)}
.opt{display:flex;align-items:center;gap:12px}
.onum{flex:none;width:36px;height:36px;border-radius:50%;background:#eef3f8;color:#2f4a66;display:grid;place-items:center;font-size:18px;font-weight:900}
.opt.right .onum{background:var(--good);color:#fff}.opt.wrong .onum{background:var(--bad);color:#fff}
.eopt .onum{width:26px;height:26px;font-size:14px;display:inline-grid;margin-right:6px;vertical-align:middle}
.opt.right{border-color:var(--good);background:#e5f6ec}
.opt.wrong{border-color:var(--bad);background:#fde9e8}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:16px;padding:16px;font-size:19px;line-height:1.7}
.feedback.good{background:#e5f6ec;border:2px solid #b8e2c8}
.feedback.bad{background:#fff2e5;border:2px solid #f3cfa6}
.feedback b{font-size:21px}
.qactions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.result{text-align:center}
.result .bigstars{font-size:56px;color:var(--gold);letter-spacing:6px}
.result .bigstars .off{color:#d8d0bd}
.result p{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f7f0de;font-size:14px}
.note{font-size:14px;color:var(--muted);line-height:1.7}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:13px;font-weight:700;color:#fff}
.wronglist li{margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}

<script>
// 題目資料：每題 o[0] 為正確答案，執行時會自動打亂選項順序
const ISLANDS = [
{
 id:"zh", name:"國語島", book:"康軒 第三冊（二上）", color:"#e8743b", icon:"📖",
 levels:[
 {id:"zh7", unit:"參 故事萬花筒", title:"第七課 國王的新衣裳", qs:[
  {q:"下面哪一個字是「衣字旁（衤）」，和衣服有關？", o:["褲","神","福","祝"], e:"「褲」是衣字旁，和衣服有關。神、福、祝是示字旁（礻），和祭拜、祝福有關。衣字旁比示字旁多一點。"},
  {q:"「衣裳」的「裳」要怎麼唸？", o:["˙ㄕㄤ（輕聲）","ㄕㄤˊ","ㄕㄤˋ","ㄔㄤˊ"], e:"「衣裳」唸 ㄧ ˙ㄕㄤ，裳唸輕聲。"},
  {q:"故事裡，騙子說他織的布有什麼特別的地方？", o:["笨的人看不見","下雨會變色","會發出亮光","摸起來是熱的"], e:"騙子說：笨的人、不稱職的人看不見這塊布。所以大家看不見，也不敢說出來。"},
  {q:"大臣明明看不見布，為什麼還說「好漂亮」？", o:["怕被別人說自己笨","布真的很漂亮","國王叫他們說謊","他們眼睛不好"], e:"大臣怕說出「看不見」，會被別人當成笨人，所以只好說假話。"},
  {q:"最後是誰大聲說出「國王什麼也沒穿」？", o:["一個小孩","國王自己","騙子","大臣"], e:"是一個小孩。小孩沒有想太多，看到什麼就說什麼，說出了真相。"},
  {q:"下面哪一句「明明……怎麼……」用得對？", o:["弟弟明明吃飽了，怎麼還說肚子餓？","我明明喜歡畫畫，所以每天畫。","明明下雨了，怎麼我們去玩水吧。","天空明明，怎麼很藍。"], e:"「明明……怎麼……」是說：事實是前面那樣，後面卻發生奇怪、不合理的事。弟弟吃飽了（事實），卻說餓（奇怪），用得最對。"},
  {q:"大家都不敢說（　）話，只好跟著稱讚國王的新衣。", o:["真","大","笑","長"], e:"「真話」就是實話。大家心裡知道看不見，卻不敢說實話。"},
  {q:"一（　）新衣裳。括號裡要填什麼？", o:["件","本","張","隻"], e:"衣服用「件」：一件衣服、一件外套。「本」用在書，「張」用在紙，「隻」用在動物。"},
  {q:"「裳」的部首是什麼？", o:["衣","口","小","尚"], e:"「裳」下面是「衣」，部首是衣部，和衣服有關。「裝、裙」也和衣服有關喔。"},
  {q:"這個故事想告訴我們什麼？", o:["要勇敢說真話，不要怕被笑","新衣服要買最貴的","要相信陌生人的話","大人說的一定對"], e:"大家怕被說笨，就跟著說假話；只有小孩說出真相。故事提醒我們要誠實、勇敢說真話。"}
 ]},
 {id:"zh8", unit:"參 故事萬花筒", title:"第八課「聰明」的小熊", qs:[
  {q:"「口（　）」想喝水。括號裡要填哪個字？", o:["渴","喝","葛","歇"], e:"口渴是身體缺水，用水字旁的「渴」；「喝」是用嘴巴，口字旁。"},
  {q:"「烏鴉（　）喝到水，把石頭放進瓶子。」填哪個詞最通順？", o:["為了","竟然","雖然","明明"], e:"「為了……」說明做事情的目的：為了喝到水，所以放石頭。"},
  {q:"小熊口渴時，學了誰的方法喝水？", o:["烏鴉","小馬","兔子","猴子"], e:"小熊想起「烏鴉喝水」的故事，學烏鴉把石頭丟進瓶子裡。"},
  {q:"烏鴉為什麼要把石頭放進瓶子？", o:["讓水升高，嘴巴才喝得到","讓水變甜","把瓶子打破","讓水變冰"], e:"瓶子裡的水太少，烏鴉的嘴巴碰不到。放進石頭，水就會升高，烏鴉就喝得到了。"},
  {q:"小馬覺得小熊其實可以怎麼做？", o:["直接拿起瓶子喝","再多放一些石頭","去找烏鴉幫忙","把瓶子丟掉"], e:"小熊有手，可以直接拿起瓶子喝。烏鴉沒有手才需要放石頭。"},
  {q:"題目的「聰明」加了引號，是什麼意思？", o:["小熊其實不太聰明","小熊是全世界最聰明的","烏鴉很笨","小馬很聰明"], e:"加上引號的「聰明」，意思和平常相反：小熊只會照著學，沒有想想自己的情況，其實不太聰明。"},
  {q:"「你為什麼要這麼做呢？」是哪一種句子？", o:["問句","驚嘆句","命令句","說明句"], e:"有「為什麼」「呢」，後面是問號，是在問問題，所以是問句。"},
  {q:"「瓶」的部首是什麼？", o:["瓦","并","土","水"], e:"「瓶」的部首是瓦部。瓦部的字常和陶土做的器物有關，例如「瓷、甕」。"},
  {q:"「聰明」的相反詞是什麼？", o:["笨","快樂","勇敢","高大"], e:"聰明的相反是笨（愚笨）。"},
  {q:"這個故事告訴我們什麼？", o:["學別人的方法，也要想想適不適合自己","喝水一定要放石頭","要多交朋友","烏鴉最聰明"], e:"好方法不一定每個人都適用。要先想一想自己的情況，再決定怎麼做，這才是真的聰明。"}
 ]},
 {id:"zh9", unit:"參 故事萬花筒", title:"第九課 大象有多重？", qs:[
  {q:"「小小的曹沖（　）想出秤大象的好方法！」填哪個詞最適合？", o:["竟然","為了","雖然","難道"], e:"「竟然」表示出乎意料：大家都想不到，小小的曹沖卻想到了。"},
  {q:"下面哪一個字的「阝」在右邊？", o:["部","陪","院","陽"], e:"「部」的阝在右邊；陪、院、陽的阝在左邊。"},
  {q:"大家想知道大象有多重，遇到什麼困難？", o:["大象太大，沒有秤可以秤","大象跑走了","大象不肯吃東西","大象太小看不到"], e:"大象又大又重，沒有那麼大的秤，所以大家想不出辦法。"},
  {q:"想出好方法的小朋友是誰？", o:["曹沖","小熊","國王","黑皮"], e:"這是「曹沖秤象」的故事，聰明的曹沖想出用船來秤大象的辦法。"},
  {q:"把大象牽上船以後，要先做什麼？", o:["在船邊水淹到的地方畫記號","把船推走","給大象洗澡","把水倒掉"], e:"大象上船，船會往下沉。在水淹到的地方畫記號，記住船沉多深。"},
  {q:"大象下船後，船上要換成什麼？", o:["石頭，一直裝到記號的地方","更多大象","水","一個大人"], e:"把石頭一塊塊搬上船，直到水又淹到剛剛的記號為止。"},
  {q:"為什麼秤石頭就知道大象多重？", o:["石頭和大象讓船沉得一樣深，所以一樣重","石頭比較好看","大象變成石頭了","石頭比大象輕"], e:"船沉到同一個記號，表示石頭的重量和大象一樣。石頭可以分開一塊塊秤，加起來就是大象的重量。"},
  {q:"下面哪一句「先……再……」的順序是對的？", o:["先在船邊畫記號，再把大象牽下船","先秤石頭，再把大象牽上船","先把石頭秤完，再畫記號","先把大象牽下船，再畫記號"], e:"要先讓大象在船上、畫好記號，才能把大象牽下船，換石頭上去。順序錯了就不能比較了。"},
  {q:"一（　）大象。括號裡填什麼最適合？", o:["頭","條","張","本"], e:"大象可以說「一頭大象」（也可以說一隻）。「條」用在魚、繩子，「張」用在紙，「本」用在書。"},
  {q:"「秤」的部首是什麼？", o:["禾","平","木","米"], e:"「秤」左邊是禾，部首是禾部。"}
 ]},
 {id:"zh10", unit:"肆 冬天的悄悄話", title:"第十課 新年快樂", qs:[
  {q:"「照相」的「相」怎麼唸？", o:["ㄒㄧㄤˋ","ㄒㄧㄤ","ㄒㄧㄤˊ","ㄒㄧㄤˇ"], e:"照相、相片、真相的「相」唸 ㄒㄧㄤˋ；互相、相信、相反唸 ㄒㄧㄤ。"},
  {q:"「（　）天氣很冷，（　）大家都很開心。」填哪一組？", o:["雖然／但是","因為／所以","一邊／一邊","先／再"], e:"前後意思相反（冷，卻很開心），要用「雖然……但是……」。"},
  {q:"寫信時，「親愛的奶奶」後面要加什麼標點？", o:["冒號「：」","句號「。」","問號「？」","刪節號「……」"], e:"書信的稱呼後面要加冒號。"},
  {q:"「我們吃了年糕、湯圓、餃子……」最後的「……」叫什麼？", o:["刪節號","冒號","頓號","引號"], e:"「……」是刪節號，表示還有很多沒說完。"},
  {q:"過年時，大門兩邊常常貼什麼？", o:["春聯","課表","地圖","海報"], e:"過年時，家家戶戶會在門邊貼上紅紅的春聯，寫著吉祥的話。"},
  {q:"除夕晚上一家人一起吃的飯，叫做什麼？", o:["年夜飯","早餐","便當","下午茶"], e:"除夕晚上全家團圓吃的飯叫年夜飯，也叫團圓飯。"},
  {q:"過年時長輩給小孩的紅包，又叫什麼？", o:["壓歲錢","零用錢","車錢","午餐錢"], e:"長輩給的紅包叫壓歲錢，有祝福平安長大的意思。"},
  {q:"過年遇到長輩，說哪一句最合適？", o:["新年快樂，身體健康！","生日快樂！","一路順風！","早日康復！"], e:"過年要說新年的祝福語，像「新年快樂、身體健康、恭喜發財」。"},
  {q:"過年吃「年糕」，「糕」和哪個字讀音一樣，有「年年高升」的意思？", o:["高","糖","好","米"], e:"「糕」和「高」讀音一樣，吃年糕代表「年年高」，一年比一年更好。"},
  {q:"「春」的部首是什麼？", o:["日","三","人","大"], e:"「春」的部首是日部，下面的「日」就是部首。"},
  {q:"一（　）春聯。括號裡填什麼？", o:["副","本","隻","顆"], e:"春聯一左一右成一組，所以說「一副春聯」（也可以說一對）。"},
  {q:"「熱熱鬧鬧」是 AABB 的疊字。下面哪一個也是 AABB？", o:["開開心心","紅通通","看一看","好朋友"], e:"AABB 是前兩個字一樣、後兩個字也一樣，例如「開開心心、高高興興」。「紅通通」是 ABB。"}
 ]},
 {id:"zh11", unit:"肆 冬天的悄悄話", title:"第十一課 遠方來的黑皮", qs:[
  {q:"冬天出門要（　）帽子。括號裡填哪個字？", o:["戴","帶","代","袋"], e:"放在頭上、身上用「戴」：戴帽子、戴手錶。隨身拿著才用「帶」：帶雨傘。"},
  {q:"「歡樂」的相反詞是什麼？", o:["難過","快樂","高興","熱鬧"], e:"歡樂是很開心，相反是難過。"},
  {q:"課文裡的「黑皮」是什麼動物？", o:["黑面琵鷺","企鵝","燕子","白鷺鷥"], e:"黑皮是一隻黑面琵鷺。牠的臉是黑色的，嘴巴長得像琵琶，所以叫黑面琵鷺。"},
  {q:"黑皮和同伴是從哪裡飛來的？", o:["寒冷的北方","炎熱的沙漠","深深的海底","高高的雪山"], e:"牠們從寒冷的北方飛來，到溫暖的地方過冬。"},
  {q:"黑皮飛到哪裡過冬？", o:["溫暖的河口","冰冷的湖","高山上","城市的公園"], e:"黑皮來到臺灣溫暖的河口，那裡有很多魚可以吃。"},
  {q:"天氣變暖以後，黑皮會怎麼做？", o:["飛回北方的故鄉","一直留在臺灣","搬到海底","去冬眠"], e:"等天氣變暖，黑皮和同伴會再飛回北方的故鄉。"},
  {q:"像黑皮這樣，會隨著季節飛來飛去的鳥叫做什麼？", o:["候鳥","留鳥","鴨子","鸚鵡"], e:"會隨季節搬家的鳥叫候鳥；一年四季都住在同一個地方的叫留鳥。"},
  {q:"「寒冷」的相反詞是什麼？", o:["溫暖","快樂","乾淨","安靜"], e:"寒冷是很冷，相反就是溫暖。"},
  {q:"「肚、胖、腳」的部首「月」，其實是從哪個字變來的？", o:["肉","月亮的月","日","目"], e:"這些字和身體有關，它們的「月」其實是「肉」變來的，叫做「肉月」，和天上的月亮不一樣。"},
  {q:"我們可以怎麼保護黑面琵鷺？", o:["不去吵牠們，保護牠們住的地方","丟石頭讓牠們飛","抓回家養","把河口填平"], e:"遠遠的安靜觀察、不破壞河口的環境，黑面琵鷺才能安心過冬。"}
 ]},
 {id:"zh12", unit:"肆 冬天的悄悄話", title:"第十二課 我愛冬天", qs:[
  {q:"下面哪一個字是兩點水（冫），和冰冷有關？", o:["凍","煮","熱","照"], e:"「凍」是兩點水，和冰冷有關；煮、熱、照的下面是「灬」，和火有關。"},
  {q:"下面哪一句是感嘆句？", o:["啊！冬天的早晨好冷！","冬天的早晨冷嗎？","冬天的早晨很冷。","請穿上外套。"], e:"有「啊！」和驚嘆號，表達強烈的感覺，是感嘆句。"},
  {passage:"冬天到了，北風呼呼的吹。小安穿上厚外套，戴上毛線帽，和奶奶一起包湯圓。熱熱的湯圓吃進肚子，小安覺得全身都暖和了。", q:"小安和誰一起包湯圓？", o:["奶奶","媽媽","哥哥","老師"], e:"短文說：「和奶奶一起包湯圓」，所以答案是奶奶。"},
  {passage:"冬天到了，北風呼呼的吹。小安穿上厚外套，戴上毛線帽，和奶奶一起包湯圓。熱熱的湯圓吃進肚子，小安覺得全身都暖和了。", q:"吃了湯圓以後，小安覺得怎麼樣？", o:["全身都暖和了","肚子很痛","想睡覺","很冷"], e:"短文最後說：小安覺得全身都暖和了。"},
  {q:"一年四季是春、夏、秋、冬，秋天後面是哪一季？", o:["冬天","春天","夏天","沒有了"], e:"四季的順序是春 → 夏 → 秋 → 冬，秋天過完就是冬天。"},
  {q:"一碗（　）的湯，喝了好溫暖。", o:["熱騰騰","冷冰冰","綠油油","亮晶晶"], e:"「熱騰騰」是很熱、冒著熱氣的樣子，最適合形容溫暖的湯。"},
  {q:"一（　）圍巾。括號裡填什麼？", o:["條","頂","雙","本"], e:"長長的東西常用「條」：一條圍巾。帽子用「頂」，手套、鞋子用「雙」。"},
  {q:"一（　）手套。括號裡填什麼？", o:["雙","條","頂","件"], e:"手套有兩隻，成一對，所以說「一雙手套」。"},
  {q:"「暖」的部首是什麼？", o:["日","火","月","爪"], e:"「暖」左邊是日，部首是日部。太陽照著就會暖暖的。"},
  {q:"「冷」的相反詞是什麼？", o:["熱","大","快","亮"], e:"冷的相反是熱。"}
 ]}
 ]
},
{
 id:"math", name:"數學島", book:"南一 2上", color:"#2f80c9", icon:"🔢",
 levels:[
 {id:"m6", unit:"第6單元", title:"兩步驟的加減", qs:[
  {q:"公車上有 25 人，到站上車 12 人，下一站又上車 8 人。現在車上有幾人？", o:["45 人","37 人","33 人","41 人"], e:"先算 25 + 12 = 37，再算 37 + 8 = 45。可以寫成 25 + 12 + 8 = 45。"},
  {q:"媽媽有 80 元，買麵包花 35 元，買牛奶花 20 元。還剩幾元？", o:["25 元","45 元","60 元","35 元"], e:"花錢要用減的：80 − 35 = 45，45 − 20 = 25。可以寫成 80 − 35 − 20 = 25。"},
  {q:"盒子裡有 40 顆糖，吃掉 15 顆，又放進 23 顆。現在有幾顆？", o:["48 顆","32 顆","78 顆","2 顆"], e:"吃掉用減：40 − 15 = 25；放進用加：25 + 23 = 48。"},
  {q:"「小明有 32 張貼紙，送給妹妹 9 張，哥哥又給他 14 張。」哪一個算式是對的？", o:["32 − 9 + 14","32 + 9 − 14","32 − 9 − 14","32 + 9 + 14"], e:"送出去的會變少（減 9），別人給的會變多（加 14），所以是 32 − 9 + 14。"},
  {q:"56 + 27 − 30 = ？", o:["53","83","113","59"], e:"由左往右算：56 + 27 = 83，83 − 30 = 53。"},
  {q:"90 − 45 − 28 = ？", o:["17","73","63","27"], e:"由左往右算：90 − 45 = 45，45 − 28 = 17。"},
  {q:"停車場有 64 輛車，開走 18 輛，又開進來 25 輛。現在有幾輛？", o:["71 輛","107 輛","21 輛","57 輛"], e:"64 − 18 = 46，46 + 25 = 71。"},

    s+=`<text x="${110+66*Math.sin(a)}" y="${110-66*Math.cos(a)+8}" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3347" font-family="Noto Sans TC,sans-serif">${n}</text>`;}

        b.geo.attributes.position.needsUpdate=true;b.pts.material.opacity=Math.max(0,1-e/2.2);});});
  }
  animated.push(t=>{for(const k in decos){const d=decos[k];if(d.group.visible)d.update(t);}});
  function setDecos(list){for(const k in decos)decos[k].group.visible=list.includes(k);}

  // flags textures by stars
  function paintFlag(item){
    const st=levelStars(item.lid),g=item.canvas.getContext("2d");
    g.fillStyle=st===3?"#f2b632":item.def.color;g.fillRect(0,0,128,96);
    g.fillStyle="#fff";g.font='900 58px "Noto Sans TC",sans-serif';g.textAlign="center";g.textBaseline="middle";g.fillText(item.num,58,46);
    if(item.fm.map)item.fm.map.dispose();const tex=new THREE.CanvasTexture(item.canvas);tex.colorSpace=THREE.SRGBColorSpace;item.fm.map=tex;item.fm.needsUpdate=true;
    const lv=LEVELS[item.lid];const nm=lv.title.replace(/^第(.+?)課\s*/,"");
    const head=lv.island.id==="zh"?lv.title.match(/^第.+?課/)[0]:lv.unit;
    item.lab.material.map.dispose();item.lab.material.map=textTex([head+"　"+"★".repeat(st)+"☆".repeat(3-st),nm.slice(0,10)],{sizes:[40,38],border:lv.island.color});
  }
  function refresh(){Object.values(islandObjs).forEach(o=>o.flags.forEach(paintFlag));}
  refresh();

  // camera control
  const cam={target:new THREE.Vector3(0,0,2),r:66,polar:.95,az:0};
  let tween=null,active=true,focus=null,hoverObj=null,dragAz=0;
  function camGoal(id){
    const asp=$cv.clientWidth/Math.max(1,$cv.clientHeight);
    const fit=asp<1?1.4/asp:1;
    if(!id)return {target:new THREE.Vector3(-4,0,1),r:72*Math.min(fit,2.3),polar:asp<1?.75:.92};
    const p=islandObjs[id].pos;const off=asp>=1.1?new THREE.Vector3(5,0,0):new THREE.Vector3(0,0,11);
    return {target:p.clone().add(new THREE.Vector3(0,2,0)).add(off),r:36*Math.min(fit,1.65),polar:.88};
  }
  function goTo(id){
    focus=id;const g=camGoal(id);
    tween={t0:performance.now(),dur:1300,from:{target:cam.target.clone(),r:cam.r,polar:cam.polar,az:cam.az},to:{...g,az:0}};
    Object.entries(islandObjs).forEach(([k,o])=>o.flags.forEach(f=>f.lab.visible=(k===id)));
    Object.entries(islandObjs).forEach(([k,o])=>o.nameLab.visible=(k!==id));
  }
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  function applyCam(t){
    const az=cam.az+(focus?0:Math.sin(t*.08)*.12)+dragAz;
    const x=cam.target.x+cam.r*Math.sin(cam.polar)*Math.sin(az),y=cam.target.y+cam.r*Math.cos(cam.polar),z=cam.target.z+cam.r*Math.sin(cam.polar)*Math.cos(az);
    camera.position.set(x,y,z);camera.lookAt(cam.target);
  }
  function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
    if(!tween){const g=camGoal(focus);cam.target.copy(g.target);cam.r=g.r;cam.polar=g.polar;}}
  window.addEventListener("resize",resize);resize();
  { const g=camGoal(null);cam.target.copy(g.target);cam.r=g.r*1.5;cam.polar=1.15;goTo(null); }

  // interaction
  const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
  function pick(e){const r=$cv.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ptr,camera);const hits=ray.intersectObjects(clickables,false);
    const flagHit=hits.find(h=>h.object.userData.type==="flag"&&(!focus||h.object.userData.item.def.id===focus));
    if(flagHit&&focus)return flagHit.object.userData;
    const h=hits.find(h=>h.object.userData.type!=="flag");return h?h.object.userData:null;}
  $cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,az:dragAz};});
  $cv.addEventListener("pointermove",e=>{
    if(down&&e.buttons){dragAz=down.az-(e.clientX-down.x)*.005;dragAz=Math.max(-.8,Math.min(.8,dragAz));return;}
    const u=pick(e);$cv.style.cursor=u?"pointer":"grab";
    const obj=u&&u.type==="flag"?u.item.group:null;
    if(hoverObj&&hoverObj!==obj)hoverObj.scale.setScalar(1);hoverObj=obj;if(obj)obj.scale.setScalar(1.18);});
  $cv.addEventListener("pointerup",e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>8)return;
    const u=pick(e);if(!u)return;
    if(u.type==="island"&&u.id!==focus){api.onIsland&&api.onIsland(u.id);}
    else if(u.type==="island"&&u.id===focus){/* already */}
    else if(u.type==="flag"){api.onFlag&&api.onFlag(u.item.lid);}
    else if(u.type==="cave"){api.onCave&&api.onCave();}
    else if(u.type==="exam"){api.onExam&&api.onExam();}
  });

  // loop
  const clock=new THREE.Clock();let last=0;
  function frame(){
    if(!active)return;requestAnimationFrame(frame);
    const t=clock.getElapsedTime(),dt=Math.min(.05,t-last);last=t;
    // water
    const p=wGeo.attributes.position;
    for(let i=0;i<p.count;i++){const x=wBase[i*3],z=wBase[i*3+2];p.setY(i,Math.sin(x*.14+t*1.1)*.28+Math.cos(z*.12+t*.9)*.22+Math.sin((x+z)*.05+t*.6)*.18);}
    p.needsUpdate=true;wGeo.computeVertexNormals();
    animated.forEach(f=>f(t));
    // villagers
    Object.values(islandObjs).forEach(o=>o.villagers.forEach(w=>{
      const ud=w.v.userData;
      if(w.pause>0){w.pause-=dt;ud.legL.rotation.x=ud.legR.rotation.x=0;ud.armR.rotation.z=Math.sin(t*8)*.6+.6;ud.armL.rotation.x=0;}
      else{w.ang+=w.dir*w.speed*dt;w.phase+=dt*9;
        if(Math.random()<.0025){w.pause=1+Math.random()*1.8;if(Math.random()<.4)w.dir*=-1;}
        const s=Math.sin(w.phase)*.55;ud.legL.rotation.x=s;ud.legR.rotation.x=-s;ud.armL.rotation.x=-s;ud.armR.rotation.x=s;ud.armR.rotation.z=0;}
      const R=6.1+Math.sin(w.ang*3)*.25;
      w.v.position.set(Math.cos(w.ang)*R,1.75+(w.pause>0?0:Math.abs(Math.sin(w.phase))*.08),Math.sin(w.ang)*R);
      w.v.rotation.y=w.pause>0?Math.atan2(Math.cos(w.ang),Math.sin(w.ang)):Math.atan2(-w.dir*Math.sin(w.ang),w.dir*Math.cos(w.ang));
    }));
    if(tween){let k=Math.min(1,(performance.now()-tween.t0)/tween.dur);const e=ease(k);
      cam.target.lerpVectors(tween.from.target,tween.to.target,e);cam.r=tween.from.r+(tween.to.r-tween.from.r)*e;cam.polar=tween.from.polar+(tween.to.polar-tween.from.polar)*e;
      dragAz=dragAz*(1-e*.08);if(k>=1)tween=null;}
    scene.fog.near=cam.r*1.2;scene.fog.far=cam.r*3;
    applyCam(t);
    renderer.render(scene,camera);
  }
  frame();
  const api={
    goTo,refresh,setDecos,
    setActive(on){if(on===active)return;active=on;if(on){clock.getDelta();requestAnimationFrame(frame);}},
    onIsland:null,onFlag:null,onCave:null,onExam:null
  };
  return api;
}

/* =================== 語音（Google 國語（臺灣）優先） =================== */
let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis&&speechSynthesis.getVoices())||[];}catch(e){VOICES=[];}}
try{if(window.speechSynthesis){loadVoices();speechSynthesis.addEventListener("voiceschanged",loadVoices);}}catch(e){}
const isGoogleTW=v=>!!v&&/google/i.test(v.name)&&(/(國語|臺灣|台灣|taiwan)/i.test(v.name)||/zh[-_]tw/i.test(v.lang));
function zhVoices(){return VOICES.filter(v=>/^(zh|cmn)/i.test(v.lang)||/(國語|中文|普通話)/.test(v.name));}
function pickVoice(){
  const vs=VOICES;
  if(ST.voice){const v=vs.find(v=>v.name===ST.voice);if(v)return v;}
  return vs.find(isGoogleTW)||vs.find(v=>/zh[-_]tw/i.test(v.lang))||vs.find(v=>/^(zh|cmn)/i.test(v.lang))||null;
}
function speakText(t){
  return t.replace(/【延伸】/g,"延伸題，").replace(/（　）/g,"括號").replace(/○/g,"圓圈").replace(/╳/g,"叉叉")
   .replace(/(\d)\s*×\s*(\d)/g,"$1乘以$2").replace(/(\d)\s*[＋+]\s*(\d)/g,"$1加$2").replace(/(\d)\s*[−\-]\s*(\d)/g,"$1減$2").replace(/\s*[=＝]\s*/g,"等於")
   .replace(/→/g,"，").replace(/[「」『』]/g,"")
   .replace(/裳/g,"商").replace(/(多|秤|一樣|又|很|太)重/g,"$1眾").replace(/第一行/g,"第一航").replace(/[\u3105-\u312F˙ˊˇˋ]+/g,"").replace(/（\s*）/g,"");
}
function speak(text,{onend,rate}={}){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const clean=speakText(text),parts=[];let cur="";
    clean.split(/(?<=[。！？；，、：])/).forEach(seg=>{if((cur+seg).length>40&&cur){parts.push(cur);cur=seg;}else cur+=seg;});
    if(cur.trim())parts.push(cur);
    const v=pickVoice();Sound.setDuck(true);
    parts.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang=v?v.lang:"zh-TW";if(v)u.voice=v;
      u.rate=rate||(isGoogleTW(v)?0.95:0.85);
      if(i===parts.length-1)u.onend=u.onerror=()=>{Sound.setDuck(false);onend&&onend();};
      speechSynthesis.speak(u);});
  }catch(e){}
}

/* =================== 小遊戲引擎 =================== */
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickN=(arr,n)=>shuffle(arr).slice(0,n);
const GEN={
  pop50(){const T=rint(4,9)*10;const ok=new Set(),items=[];let g=0;
    while(ok.size<5&&g++<500){const a=rint(10,T+30),b=rint(2,40);let e,v;
      if(Math.random()<.5){const c=T-a-b;if(c<1||a+b>99)continue;e=`${a} + ${b} + ${c}`;}else{const c=a+b-T;if(c<1||a+b>99)continue;e=`${a} + ${b} − ${c}`;}
      if(!ok.has(e)){ok.add(e);items.push([e,1]);}}
    const bad=new Set();g=0;while(bad.size<5&&g++<500){const d=T+[-10,-5,-2,2,5,10][rint(0,5)];const a=rint(10,40),b=rint(5,30),c=d-a-b;if(c<1)continue;const e=`${a} + ${b} + ${c}`;if(!ok.has(e)&&!bad.has(e)){bad.add(e);items.push([e,0]);}}
    return {prompt:`戳破所有答案是 ${T} 的泡泡！`,items};},
  _popMul(bases){const b=bases[rint(0,bases.length-1)];const mult=pickN([1,2,3,4,5,6,7,8,9],5).map(k=>[String(b*k),1]);
    const used=new Set(mult.map(x=>x[0]));const wrong=[];let g=0;while(wrong.length<5&&g++<300){const n=rint(b+1,b*9);if(n%b&&!used.has(String(n))){used.add(String(n));wrong.push([String(n),0]);}}
    return {prompt:`戳破所有「${b} 的乘法」答案（${b} × 幾）的泡泡！`,items:[...mult,...wrong]};},
  popMul2548(){return GEN._popMul([2,5,4,8]);},popMul3679(){return GEN._popMul([3,6,7,9]);},
  _mul(bases){const pairs=[],ps=new Set();let g=0;while(pairs.length<6&&g++<300){const a=bases[rint(0,bases.length-1)],b=rint(2,9);if(ps.has(a*b))continue;ps.add(a*b);pairs.push([`${a} × ${b}`,String(a*b)]);}return {pairs};},
  mul2548(){return GEN._mul([2,5,4,8]);},mul3679(){return GEN._mul([3,6,7,9]);},
  popSquare(){const sq=r=>`<svg width="56" height="56" viewBox="0 0 56 56"><rect x="12" y="12" width="32" height="32" fill="#cfe8ff" stroke="#1f3347" stroke-width="3" transform="rotate(${r} 28 28)"/></svg>`;
    const rc=r=>`<svg width="56" height="56" viewBox="0 0 56 56"><rect x="6" y="17" width="44" height="22" fill="#ffe2a8" stroke="#1f3347" stroke-width="3" transform="rotate(${r} 28 28)"/></svg>`;
    const tr=r=>`<svg width="56" height="56" viewBox="0 0 56 56"><polygon points="28,8 50,46 6,46" fill="#c9f0d5" stroke="#1f3347" stroke-width="3" transform="rotate(${r} 28 28)"/></svg>`;
    return {prompt:"戳破所有的正方形（斜放的也算喔）！",html:true,items:[[sq(0),1],[sq(45),1],[sq(20),1],[sq(0),1],[rc(0),0],[rc(30),0],[rc(90),0],[tr(0),0],[tr(180),0],[tr(30),0]]};}
};
let G=null;
function startGame(lid,gi){
  const cfg=Object.assign({},GAMES[lid][gi]);if(cfg.gen)Object.assign(cfg,GEN[cfg.gen]());
  G={lid,gi,cfg,mistakes:0,done:false};
  $hud.innerHTML="";bgWorld(false);renderBuddy(true);Sound.play(LEVELS[lid].island.id);
  ({match:gMatch,sort:gSort,order:gOrder,pop:gPop,clock:gClock,quick:gQuick})[cfg.type]();
  setTimeout(()=>buddySay("game",{speakIt:false}),400);
}
function gameFrame(inner){
  const lv=LEVELS[G.lid];
  setPage(header()+`<div class="qhead"><button class="btn small ghost" id="gq">← 回關卡</button><span class="pill zyok">${esc(G.cfg.title)}</span><span class="pill">❌ ${G.mistakes}</span></div>
   <div class="card game"><div class="qtitle"><span class="tag" style="background:${lv.island.color}">${lv.island.name}</span> <span class="ttl">${esc(lv.title)}</span></div>
   <div class="qtext" style="font-size:22px">${esc(G.cfg.prompt)}</div><div id="gbody">${inner}</div></div>`);
  document.getElementById("gq").onclick=()=>{Sound.sfx("click");showLevel(G.lid,"game");};
}
function gMiss(el){G.mistakes++;Sound.sfx("wrong");if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");}
  const pill=$app.querySelectorAll(".qhead .pill")[1];if(pill)pill.textContent="❌ "+G.mistakes;}
function gWin(){
  if(G.done)return;G.done=true;const p=prof();const st=G.mistakes===0?3:G.mistakes<=2?2:1;
  p.games=p.games||{};const k=G.lid+"-"+G.gi;const r=p.games[k]||{best:0,plays:0};r.best=Math.max(r.best,st);r.plays++;r.date=today();p.games[k]=r;
  p.shells=(p.shells||0)+2;save();addXP(5);Sound.sfx("complete");
  setTimeout(()=>{rerender=()=>{};const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="card result"><h2 class="zyok">過關了！</h2><div class="bigstars">${starHTML(st)}</div><p class="zyok">錯了 ${G.mistakes} 次・獲得 🐚 × 2</p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="btn" id="ga">再玩一次</button><button class="btn primary" id="gb">回關卡</button></div></div>`;
    document.body.appendChild(m);applyZhuyin(m);buddySay("gameWin");
    m.querySelector("#ga").onclick=()=>{m.remove();startGame(G.lid,G.gi);};m.querySelector("#gb").onclick=()=>{m.remove();showLevel(G.lid,"game");};},600);
}
function gMatch(){
  const cards=shuffle(G.cfg.pairs.flatMap((pr,i)=>[{t:pr[0],k:i},{t:pr[1],k:i}]));let open=[],lock=true,matched=0,cd=12,timer=null;
  rerender=()=>{};
  gameFrame(`<div class="mbar" id="mb"><b class="zyok" id="mtip">先看清楚每張卡片，記住哪兩張是一對！</b><button class="btn primary" id="mgo">記好了，開始翻牌！（<span id="mcd">${cd}</span>）</button></div>
    <div class="mgrid" style="margin-top:12px">${cards.map((c,i)=>`<button class="mcard peek" data-i="${i}"><span class="back">❓</span><span class="face zyok">${esc(c.t)}</span></button>`).join("")}</div>
    <div class="mbar"><button class="btn small hidden" id="mpeek">👀 偷看 2 秒（錯誤 +1）</button></div>`);
  const els=[...$app.querySelectorAll(".mcard")];
  const start=()=>{clearInterval(timer);if(!lock)return;lock=false;els.forEach(e=>e.classList.remove("peek"));
    const mb=document.getElementById("mb");if(mb)mb.innerHTML=`<b class="zyok">開始翻牌！找出配對的兩張卡片。</b>`;applyZhuyin(mb);
    document.getElementById("mpeek").classList.remove("hidden");Sound.sfx("whoosh");};
  timer=setInterval(()=>{cd--;const c=document.getElementById("mcd");if(c)c.textContent=cd;if(cd<=0)start();if(!document.body.contains(els[0]))clearInterval(timer);},1000);
  document.getElementById("mgo").onclick=()=>{Sound.sfx("click");start();};
  document.getElementById("mpeek").onclick=()=>{if(lock)return;lock=true;G.mistakes++;const pill=$app.querySelectorAll(".qhead .pill")[1];if(pill)pill.textContent="❌ "+G.mistakes;
    els.forEach(e=>{if(!e.classList.contains("done"))e.classList.add("peek");});setTimeout(()=>{els.forEach(e=>e.classList.remove("peek"));open.forEach(x=>x.classList.remove("open"));open=[];lock=false;},2000);};
  els.forEach(el=>el.onclick=()=>{
    if(lock||el.classList.contains("open"))return;el.classList.add("open");Sound.sfx("click");open.push(el);
    if(open.length===2){const [a,b]=open.map(x=>cards[+x.dataset.i]);
      if(a.k===b.k){open.forEach(x=>x.classList.add("done"));open=[];matched++;Sound.sfx("correct");if(matched===G.cfg.pairs.length)gWin();}
      else{lock=true;G.mistakes++;const pill=$app.querySelectorAll(".qhead .pill")[1];if(pill)pill.textContent="❌ "+G.mistakes;
        setTimeout(()=>{open.forEach(x=>x.classList.remove("open"));open=[];lock=false;},850);}}
  });
}
function gSort(){
  const items=shuffle(G.cfg.items);let i=0;const placed=[[],[]];rerender=()=>{};
  const draw=()=>{
    gameFrame(`<div class="sortwrap"><div class="sortitem ${i<items.length?"":"hidden"}" id="si"><span class="zyok">${i<items.length?esc(items[i][0]):""}</span></div>
     <div class="bins">${G.cfg.bins.map((bn,k)=>`<button class="bin" data-k="${k}"><b class="zyok">${esc(bn)}</b><div class="binin">${placed[k].map(t=>`<span class="chip zyok">${esc(t)}</span>`).join("")}</div></button>`).join("")}</div></div>`);
    $app.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{if(i>=items.length)return;const k=+b.dataset.k;
      if(items[i][1]===k){placed[k].push(items[i][0]);i++;Sound.sfx("correct");draw();if(i>=items.length)gWin();}
      else gMiss(document.getElementById("si"));});
  };draw();
}
function gOrder(){
  const steps=G.cfg.steps;const tiles=shuffle(steps.map((s,k)=>({s,k})));let next=0;rerender=()=>{};
  const draw=()=>{
    gameFrame(`<div class="slots">${steps.map((s,k)=>`<div class="slot ${k<next?"fill":""}"><span class="sn">${k+1}</span><span class="zyok">${k<next?esc(s):""}</span></div>`).join("")}</div>
      <div class="tiles">${tiles.filter(t=>t.k>=next).map(t=>`<button class="tile" data-k="${t.k}"><span class="zyok">${esc(t.s)}</span></button>`).join("")}</div>`);
    $app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(+b.dataset.k===next){next++;Sound.sfx("correct");draw();if(next>=steps.length)gWin();}else gMiss(b);});
  };draw();
}
function gPop(){
  const items=shuffle(G.cfg.items);const need=items.filter(x=>x[1]).length;let got=0;rerender=()=>{};
  gameFrame(`<div class="poparea">${items.map((it,i)=>`<button class="bubble" data-i="${i}" style="left:${(i%5)*19+2}%;top:${Math.floor(i/5)*48+6}%;animation-delay:${(i*.37)%2}s">${G.cfg.html?it[0]:`<span class="zyok">${esc(it[0])}</span>`}</button>`).join("")}</div>`);
  $app.querySelectorAll(".bubble").forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];
    if(it[1]){b.classList.add("popped");b.disabled=true;got++;Sound.sfx("shell");if(got>=need)gWin();}else gMiss(b);});
}
function gClock(){
  const rounds=[...Array(5)].map((_,k)=>({h:rint(1,12),m:k<3?rint(0,11)*5:rint(0,59)}));let r=0,h=12,m=0;rerender=()=>{};
  const draw=(msg="")=>{const t=rounds[Math.min(r,rounds.length-1)];
    gameFrame(`<div class="clockgame"><div class="target zyok">第 ${r+1} / 5 題：請撥到 <b>${t.h} 時 ${t.m} 分</b></div>
     <div class="visual">${clockSVG(h,m)}</div>
     <div class="cctl"><div><span class="zyok">時</span><button class="btn small" data-a="h-">◀</button><b>${h}</b><button class="btn small" data-a="h+">▶</button></div>
     <div><span class="zyok">分</span><button class="btn small" data-a="m-5">−5</button><button class="btn small" data-a="m-1">−1</button><b>${m}</b><button class="btn small" data-a="m+1">+1</button><button class="btn small" data-a="m+5">+5</button></div></div>
     <div class="zyok" style="min-height:28px;text-align:center;font-weight:700">${msg}</div>
     <div class="qactions" style="justify-content:center"><button class="btn primary" id="chk">對答案</button></div></div>`);
    $app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;Sound.sfx("click");
      if(a==="h-")h=h===1?12:h-1;if(a==="h+")h=h===12?1:h+1;
      if(a[0]==="m"){m=(m+parseInt(a.slice(1),10)+60)%60;}draw();});
    document.getElementById("chk").onclick=()=>{const t=rounds[r];
      if(t.h===h&&t.m===m){Sound.sfx("correct");r++;if(r>=rounds.length){const tg=document.querySelector(".target");if(tg)tg.textContent="全部答對了！";gWin();}else{h=12;m=0;draw("答對了！下一題！");}}
      else{gMiss(document.querySelector(".visual"));draw(`再試試看：短針看「時」，長針看「分」喔！`);}};
  };draw();
}
function gQuick(){
  const items=shuffle(G.cfg.items);let i=0;rerender=()=>{};

function isRight(it,a){if(a==null)return false;if(it.kind==="order")return Array.isArray(a)&&a.join()===it.steps.map((_,k)=>k).join();return a===it.answer||(it.kind==="num"&&+a===+it.answer);}

let S=null;
function leaveToMap(){try{speechSynthesis.cancel()}catch(e){};Sound.setDuck(false);if(S&&S.mode==="level"&&rerender===showQ)return showLevel(S.lid,"quiz");mapMode();}
function startLevel(id){
  const lv=LEVELS[id];
  S={mode:"level",lid:id,island:lv.island.id,title:lv.title,items:shuffle(lv.qs.map((q,i)=>({lid:id,qi:i,q}))),i:0,correct:0,shells:0,answered:false};
  $hud.innerHTML="";bgWorld(false);Sound.play(lv.island.id);renderBuddy(true);showQ();setTimeout(()=>buddySay("start",{speakIt:false}),300);
}
function startCave(){
  const p=prof();const keys=Object.keys(p.wrong||{});
  $hud.innerHTML="";bgWorld(false);Sound.play("cave");
  if(!keys.length){rerender=startCave;setPage(header()+`<div class="card result"><div style="font-size:64px">💎</div><h2>寶藏洞是空的！</h2><p>目前沒有答錯的題目，太厲害了！</p><button class="btn primary" id="bk">回地圖</button></div>`);document.getElementById("bk").onclick=leaveToMap;return;}
  const items=keys.map(k=>{const [lid,qi]=k.split("#");return {lid,qi:+qi,q:LEVELS[lid]&&LEVELS[lid].qs[+qi]};}).filter(x=>x.q);
  S={mode:"cave",title:"寶藏洞（錯題本）",items:shuffle(items),i:0,correct:0,shells:0};
  showQ();
}
function showQ(){
  const it=S.items[S.i],q=it.q,lv=LEVELS[it.lid];
  if(!S.opts||S.optsFor!==S.i){S.opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));S.optsFor=S.i;S.picked=null;}
  const opts=S.opts;
  rerender=showQ;
  const pct=Math.round(S.i/S.items.length*100);
  let vis="";if(q.clock)vis=clockSVG(q.clock[0],q.clock[1]);if(q.shape)vis=shapeSVG(q.shape);
  setPage(header()+`<div class="qhead"><button class="btn small ghost" id="quit">← 地圖</button>
    <div class="progress"><i style="width:${pct}%"></i></div><span class="pill">${S.i+1} / ${S.items.length}</span></div>
  <div class="card">
    <div class="qtitle"><span class="tag" style="background:${lv.island.color}">${lv.island.name}</span> <span class="ttl">${esc(lv.title)}</span></div>
    ${q.passage?`<div class="passage">${esc(q.passage)}</div>`:""}
    <div class="qtext">${esc(q.q)}</div>
    ${vis?`<div class="visual">${vis}</div>`:""}
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="onum nozy">${k+1}</span><span class="otx">${esc(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="qactions"><button class="btn small" id="spk">🔊 唸題目</button><button class="btn primary hidden" id="next">${S.i+1<S.items.length?"下一題 →":"看結果 🏁"}</button></div>
  </div>`);
  {const sp=document.getElementById("shellPill");if(sp)sp.onclick=null;}
  document.getElementById("quit").onclick=leaveToMap;
  document.getElementById("spk").onclick=()=>speak((q.passage?q.passage+"。":"")+q.q+"。"+opts.map((o,k)=>`第${k+1}個，${o.t}`).join("。"));
  const btns=[...$app.querySelectorAll(".opt")];
  const reveal=(k,fresh)=>{
    const o=opts[k];
    btns.forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add("right");});
    if(!o.ok)btns[k].classList.add("wrong");
    const fb=document.getElementById("fb");
    if(o.ok)fb.innerHTML=`<div class="feedback good"><b>✅ 答對了！+1 🐚</b><br>${esc(q.e)}</div>`;
    else fb.innerHTML=`<div class="feedback bad"><b>🤔 再想想看～</b> 正確答案是「${esc(opts.find(x=>x.ok).t)}」。<br>${esc(q.e)}<br><span style="font-size:15px;color:#8a5a2b">這題已放進💎寶藏洞，之後可以再挑戰。</span></div>`;
    applyZhuyin(fb);
    const nx=document.getElementById("next");nx.classList.remove("hidden");if(fresh)nx.focus();
    nx.onclick=()=>{Sound.sfx("click");S.i++;if(S.i<S.items.length)showQ();else showResult();};
  };
  if(S.picked!=null)reveal(S.picked,false);
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,o=opts[k];S.picked=k;
    const p=prof(),wkey=it.lid+"#"+it.qi;p.wrong=p.wrong||{};
    if(o.ok){S.correct++;S.shells++;p.shells=(p.shells||0)+1;if(S.mode==="cave")delete p.wrong[wkey];
      Sound.sfx("correct");setTimeout(()=>Sound.sfx("shell"),380);popShell();
      const sp=document.getElementById("shellPill");if(sp)sp.textContent="🐚 "+p.shells;
      S.streak=(S.streak||0)+1;addXP(2);setTimeout(()=>buddySay(S.streak>=3&&S.streak%3===0?"streak":"correct",{speakIt:S.streak%3===0}),500);}
    else{p.wrong[wkey]={d:today(),n:((p.wrong[wkey]||{}).n||0)+1};Sound.sfx("wrong");S.streak=0;setTimeout(()=>buddySay("wrong"),400);}
    save();reveal(k,true);
  });
}
document.addEventListener("keydown",e=>{if(rerender!==showQ)return;if(/^[1-4]$/.test(e.key)){const b=$app.querySelectorAll(".opt")[+e.key-1];if(b&&!b.disabled)b.click();}else if(e.key==="Enter"){const n=document.getElementById("next");if(n&&!n.classList.contains("hidden"))n.click();}});
function popShell(){const d=document.createElement("div");d.className="shell-pop";d.textContent="🐚";document.body.appendChild(d);setTimeout(()=>d.remove(),950);}
function showResult(){
  const p=prof(),pct=Math.round(S.correct/S.items.length*100),st=starsFor(pct);
  if(S.mode==="level"&&!S.saved){p.levels=p.levels||{};const r=p.levels[S.lid]||{best:0,plays:0};
    r.best=Math.max(r.best,pct);r.plays++;r.last=pct;r.date=today();p.levels[S.lid]=r;save();S.saved=true;
    Sound.sfx("complete");for(let i=0;i<st;i++)setTimeout(()=>Sound.sfx("star"),700+i*260);}
  rerender=showResult;
  const msg=st===3?"太厲害了，這一區被你征服了！":st===2?"很棒！再挑戰一次就能拿滿三顆星！":"沒關係，看看講解，再試一次會更好！";
  setPage(header()+`<div class="card result">
    <h2>${esc(S.title)} 探險完成！</h2>
    <div class="bigstars">${starHTML(st)}</div>
    <p>答對 <b>${S.correct}</b> / ${S.items.length} 題　獲得 🐚 × ${S.shells}</p>
    <p>${msg}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="again">再挑戰一次</button><button class="btn primary" id="bk">${S.mode==="level"?"回關卡":"回地圖"}</button></div></div>`);
  if(!S.said){S.said=1;setTimeout(()=>buddySay(st>=2?"finishGood":"finishOk",{force:true}),900);if(S.mode==="level")addXP(5);}
  document.getElementById("again").onclick=()=>{Sound.sfx("click");S.mode==="level"?startLevel(S.lid):startCave();};
  document.getElementById("bk").onclick=()=>{Sound.sfx("click");if(S.mode==="level")showLevel(S.lid,"quiz");else leaveToMap();};
}

const SHOP_AVATAR=[{a:"🐼",price:10},{a:"🦁",price:10},{a:"🐧",price:10},{a:"🐰",price:10},{a:"🦄",price:15},{a:"🦖",price:15},{a:"🐉",price:15},{a:"🧚",price:20}];
let shopTab="deco";
function ownedOf(p){p.owned=p.owned||{};p.owned.deco=p.owned.deco||{};p.owned.avatar=p.owned.avatar||{};return p.owned;}
function spend(p,price){if((p.shells||0)<price)return false;p.shells-=price;save();return true;}
function showShop(){
  const p=prof();if(!p)return showProfiles();
  rerender=showShop;$hud.innerHTML="";bgWorld(false);Sound.play("sea");
  const own=ownedOf(p),sh=p.shells||0,rw=p.rewards||[],pend=(p.coupons||[]).filter(c=>!c.done);
  const tabs=[["deco","🏝️ 島嶼裝飾"],["avatar","🧑‍🚀 隊員造型"],["real","🎁 家長獎勵"]];
  const buyBtn=(price,owned,key)=>owned?`<span class="pill" style="background:#e5f6ec">✔ 已擁有</span>`:
    `<button class="btn small ${sh>=price?"primary":""}" data-buy="${key}" ${sh>=price?"":"disabled style='opacity:.55'"}>🐚 ${price}</button>`;
  let body="";
  if(shopTab==="deco")body=`<p class="note zyok">買了以後，回到立體地圖就會在海上或島上看到喔！</p><div class="shop">${SHOP_DECO.map(d=>`<div class="sitem"><div class="sicon">${d.icon}</div><div class="sname zyok">${d.name}</div><div class="sdesc zyok">${d.desc}</div>${buyBtn(d.price,own.deco[d.id],"deco:"+d.id)}</div>`).join("")}</div>`;
  else if(shopTab==="avatar")body=`<p class="note zyok">買了以後可以換成新的頭像。</p><div class="shop">${SHOP_AVATAR.map(v=>{const o=own.avatar[v.a];const using=p.avatar===v.a;
      return `<div class="sitem"><div class="sicon">${v.a}</div>${o?(using?`<span class="pill" style="background:#fff6dc">使用中</span>`:`<button class="btn small" data-use="${v.a}">換上</button>`):buyBtn(v.price,false,"avatar:"+v.a)}</div>`;}).join("")}
      ${AVATARS.map(a=>p.avatar===a?"":`<div class="sitem"><div class="sicon">${a}</div><button class="btn small" data-use="${a}">換上</button></div>`).join("")}</div>`;
  else body=rw.length?`<p class="note zyok">這些是爸爸媽媽或老師準備的獎勵。兌換後，請拿給大人看！</p><div class="shop">${rw.map(r=>`<div class="sitem"><div class="sicon">🎁</div><div class="sname zyok">${esc(r.name)}</div>${buyBtn(r.price,false,"real:"+r.id)}</div>`).join("")}</div>
      ${pend.length?`<h3 class="zyok">等大人兌現的獎勵</h3><ul>${pend.map(c=>`<li class="zyok">${esc(c.name)}（${c.date}）</li>`).join("")}</ul>`:""}`
    :`<p class="zyok">還沒有家長獎勵。請大人到「📋 大人看這裡」新增，例如「看卡通 15 分鐘」「選週末點心」。</p>`;
  setPage(header(`<button class="btn small ghost" id="bk">← 地圖</button>`)+`<div class="card">
    <h2 class="zyok">🛒 貝殼商店</h2>
    <p class="zyok" style="margin-top:-4px">每答對一題可以得到 1 個貝殼。你現在有 <b style="font-size:24px">🐚 ${sh}</b></p>
    <div class="tabs">${tabs.map(([k,n])=>`<button class="tog ${shopTab===k?"on":""}" data-tab="${k}">${n}</button>`).join("")}</div>
    ${body}</div>`);
  document.getElementById("bk").onclick=()=>{Sound.sfx("click");mapMode();};
  $app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{Sound.sfx("click");shopTab=b.dataset.tab;showShop();});
  $app.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{Sound.sfx("flag");p.avatar=b.dataset.use;save();showShop();});
  $app.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const [kind,key]=b.dataset.buy.split(/:(.+)/);
    if(kind==="deco"){const d=SHOP_DECO.find(x=>x.id===key);confirmBox(`要用 ${d.price} 個貝殼買「${d.name}」嗎？`,()=>{if(spend(p,d.price)){own.deco[key]=1;save();Sound.sfx("buy");showShop();}});}
    else if(kind==="avatar"){const v=SHOP_AVATAR.find(x=>x.a===key);confirmBox(`要用 ${v.price} 個貝殼買這個頭像嗎？`,()=>{if(spend(p,v.price)){own.avatar[key]=1;p.avatar=key;save();Sound.sfx("buy");showShop();}});}
    else{const r=(p.rewards||[]).find(x=>x.id===key);if(!r)return;confirmBox(`要用 ${r.price} 個貝殼兌換「${r.name}」嗎？`,()=>{if(spend(p,r.price)){p.coupons=p.coupons||[];p.coupons.push({id:Date.now()+"",name:r.name,price:r.price,date:today(),done:false});save();Sound.sfx("buy");showShop();}});}
  });
}

/* =================== 大人頁 =================== */
function showAdult(){
  const p=prof();rerender=showAdult;$hud.innerHTML="";bgWorld(false);
  const rows=ISLANDS.map(is=>is.levels.map(lv=>{const r=(p.levels||{})[lv.id];
    const wn=Object.keys(p.wrong||{}).filter(k=>k.startsWith(lv.id+"#")).length;
    return `<tr><td><span class="tag" style="background:${is.color}">${is.name}</span></td><td>${esc(lv.title)}</td><td>${r?r.best+"%":"—"}</td><td>${r?r.last+"%":"—"}</td><td>${r?r.plays:0}</td><td>${r?r.date:"—"}</td><td>${wn||""}</td></tr>`;}).join("")).join("");
  const wl=Object.keys(p.wrong||{}).map(k=>{const [lid,qi]=k.split("#");const lv=LEVELS[lid];if(!lv||!lv.qs[+qi])return "";
    const q=lv.qs[+qi];return `<li><b>${esc(lv.title)}</b>：${esc(q.q)}<br><span class="note">正確答案：${esc(q.o[0])}・錯 ${p.wrong[k].n} 次・最近 ${p.wrong[k].d}</span></li>`;}).join("");
  setPage(header(`<button class="btn small ghost" id="bk">← 地圖</button>`)+`
  <div class="card"><h2>📋 <span class="nozy">${esc(p.name)}</span> 的學習紀錄</h2>
  <div style="overflow-x:auto"><table><tr><th>島</th><th>關卡</th><th>最佳</th><th>最近</th><th>次數</th><th>日期</th><th>待複習</th></tr>${rows}</table></div>
  <h3>💎 目前的錯題（${Object.keys(p.wrong||{}).length} 題）</h3>
  ${wl?`<ol class="wronglist">${wl}</ol>`:`<p class="note">目前沒有錯題。</p>`}
  <h3>🔊 語音設定</h3>
  <div id="vbox" class="note"></div>
  <div class="rwrow"><select id="vsel" style="font-size:16px;padding:8px;border-radius:10px;max-width:100%"></select><button class="btn small" id="vtest">試聽</button></div>
  <label class="chk" style="display:inline-block;margin:6px 0"><input type="checkbox" id="bvoice" ${ST.buddyVoice?"checked":""}> 小書僮說話時也念出聲音</label>
  <h3>📝 考卷紀錄</h3>
  ${(p.exams||[]).length?`<table><tr><th>日期</th><th>科目</th><th>分數</th><th>錯題數</th></tr>${(p.exams||[]).slice().reverse().slice(0,15).map(h=>`<tr><td>${h.date}</td><td>${({zh:"國語",math:"數學",life:"生活"})[h.sub]}</td><td><b>${h.score}</b></td><td>${h.wrong}</td></tr>`).join("")}</table>`:'<p class="note">還沒有考卷紀錄。</p>'}
  ${(p.examWrong||[]).length?`<details><summary class="note">最近考卷錯題（${p.examWrong.length}）</summary><ol class="wronglist">${p.examWrong.slice().reverse().slice(0,30).map(w=>`<li>【${({zh:"國語",math:"數學",life:"生活"})[w.sub]}】${esc(w.q)}<br><span class="note">正確答案：${esc(w.a)}・${w.d}</span></li>`).join("")}</ol></details>`:""}
  ${p.buddy?`<p class="note">伴讀小書僮：${esc(p.buddy.name)}（經驗 ${p.buddy.xp}）</p>`:""}
  <h3>🎁 家長獎勵（貝殼兌換）</h3>
  <p class="note">在這裡設定孩子可以用貝殼兌換的真實獎勵。孩子在商店兌換後，會出現在下面的「待兌現」清單，兌現後按「已兌現」即可。參考：全部 123 題答對一輪約可得 123 個貝殼。</p>
  ${(p.rewards||[]).map(r=>`<div class="rwrow"><span class="pill">🎁 ${esc(r.name)}・🐚 ${r.price}</span><button class="btn small" data-delrw="${r.id}">刪除</button></div>`).join("")||'<p class="note">尚未設定獎勵。</p>'}
  <div class="rwrow"><input id="rwn" placeholder="獎勵名稱，例如：看卡通 15 分鐘" maxlength="20" style="flex:1;min-width:200px"><input id="rwp" type="number" min="1" value="30" style="width:90px"><button class="btn small primary" id="rwadd">新增</button></div>
  <h4>待兌現</h4>
  ${(p.coupons||[]).filter(c=>!c.done).map(c=>`<div class="rwrow"><span>${esc(c.name)}（${c.date}・🐚 ${c.price}）</span><button class="btn small primary" data-done="${c.id}">已兌現</button></div>`).join("")||'<p class="note">目前沒有。</p>'}
  ${(p.coupons||[]).some(c=>c.done)?`<details><summary class="note">已兌現紀錄</summary><ul class="note">${p.coupons.filter(c=>c.done).map(c=>`<li>${esc(c.name)}（兌換 ${c.date}）</li>`).join("")}</ul></details>`:""}
  <p class="note">目前貝殼：🐚 ${p.shells||0}　<button class="btn small" id="addshell">＋10 貝殼（獎勵用）</button></p>
  <h3>使用說明</h3>
  <div class="note">
  ・<b>範圍</b>：國語康軒第三冊第七～十二課；數學南一 2上 第 6～10 單元；生活翰林 2上 第 3～6 單元（期中考之後的進度）。<br>
  ・<b>題目來源</b>：全部是依各課單元主題與學習重點原創的練習題，<b>不是課本、習作或評量原題</b>。國語的生字、語詞請以課本為準。<br>
  ・<b>注音</b>：右上角「ㄅㄆㄇ」可開關。注音是自動標注、再依臺灣讀音人工校正，若與課本不同，以課本為準。<br>
  ・<b>立體地圖</b>：點島嶼靠近，點旗子🚩進入該課；可左右拖曳轉動視角。裝置較舊或不支援時，可改用「平面地圖」。<br>
  ・<b>音樂與音效</b>：每座島有不同的背景音樂，右上角可分別關閉。按「唸題目」時音樂會自動變小聲。<br>
  ・<b>星星</b>：每關答對 90% 以上 ★★★，70% 以上 ★★，完成 ★。選項順序每次都會重新打亂。<br>
  ・<b>關卡大廳</b>：點旗子或課名，先看「重點複習」（生字卡、句型、易錯提醒／學習重點、觀念釐清），再玩「小遊戲」，最後「闖關練習」。<br>
  ・<b>考卷島</b>：每張 20 題、100 分，每次重新隨機出題，考過的題目會記錄下來盡量不重複；錯題列在上面的考卷紀錄。<br>
  ・<b>伴讀小書僮</b>：答對、玩遊戲、寫考卷都會讓小書僮長大（蛋 → 寶寶 → 小書僮 → 大書僮 → 書僮大師）；可在書僮小屋用貝殼買點心餵牠。<br>
  ・<b>貝殼商店</b>：每答對一題得 1 個貝殼，可以買島嶼裝飾（會出現在立體地圖上）、新頭像，或兌換上面設定的家長獎勵。<br>
  ・<b>寶藏洞</b>：答錯的題目自動收進來，在寶藏洞答對就會移除，適合隔天再複習。<br>
  ・紀錄只存在這台裝置的瀏覽器中。
  </div>
  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn small" id="rs">清除紀錄</button>
    <button class="btn small" id="del">刪除這位隊員</button></div></div>`);
  document.getElementById("bk").onclick=()=>{Sound.sfx("click");mapMode();};
  const fillV=()=>{loadVoices();const vs=zhVoices(),cur=pickVoice(),sel=document.getElementById("vsel");if(!sel)return;
    sel.innerHTML=`<option value="">自動選擇（優先 Google 國語（臺灣））</option>`+vs.map(v=>`<option value="${esc(v.name)}" ${ST.voice===v.name?"selected":""}>${esc(v.name)}（${v.lang}）</option>`).join("");
    const box=document.getElementById("vbox");const g=VOICES.find(isGoogleTW);
    box.innerHTML=g?`✅ 這台裝置有「${esc(g.name)}」${cur&&cur.name===g.name?"，目前正在使用。":"。"}`:`⚠️ 這台裝置的瀏覽器找不到「Google 國語（臺灣）」。這個語音只在<b>電腦版 Chrome</b>（Windows、Mac）裡有；iPad、iPhone 沒有，會改用其他臺灣中文語音${cur?"（目前：「"+esc(cur.name)+"」）":""}。想用 Google 語音，請用電腦的 Chrome 打開這個網頁。`;};
  fillV();setTimeout(fillV,800);
  document.getElementById("vsel").onchange=e=>{ST.voice=e.target.value;save();fillV();};
  document.getElementById("vtest").onclick=()=>speak("你好！我是伴讀小書僮。大象有多重？我們一起來複習吧！");
  document.getElementById("bvoice").onchange=e=>{ST.buddyVoice=e.target.checked;save();};
  document.getElementById("rwadd").onclick=()=>{const n=document.getElementById("rwn").value.trim(),pr=parseInt(document.getElementById("rwp").value,10);
    if(!n||!(pr>0))return;p.rewards=p.rewards||[];p.rewards.push({id:Date.now()+"",name:n,price:pr});save();showAdult();};
  $app.querySelectorAll("[data-delrw]").forEach(b=>b.onclick=()=>{p.rewards=(p.rewards||[]).filter(r=>r.id!==b.dataset.delrw);save();showAdult();});
  $app.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const c=(p.coupons||[]).find(x=>x.id===b.dataset.done);if(c){c.done=true;c.doneDate=today();save();showAdult();}});
  document.getElementById("addshell").onclick=()=>{p.shells=(p.shells||0)+10;save();Sound.sfx("shell");showAdult();};
  document.getElementById("rs").onclick=()=>confirmBox(`確定要清除 ${p.name} 的所有星星、貝殼、商店物品和錯題嗎？（家長獎勵設定會保留）`,()=>{p.levels={};p.wrong={};p.shells=0;p.owned={};p.coupons=[];save();showAdult();});
  document.getElementById("del").onclick=()=>confirmBox(`確定要刪除隊員 ${p.name} 嗎？`,()=>{delete mem.profiles[mem.current];mem.current=null;save();showProfiles();});
}
function confirmBox(msg,yes){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><p style="font-size:19px" class="nozy">${esc(msg)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn small" id="cn">取消</button><button class="btn small primary" id="ok">確定</button></div></div>`;
  document.body.appendChild(m);applyZhuyin(m);
  m.querySelector("#cn").onclick=()=>m.remove();
  m.querySelector("#ok").onclick=()=>{m.remove();yes();};
}

try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}
if(mem.current&&mem.profiles[mem.current])showMap();else showProfiles();
})();
</script>
